<!DOCTYPE html> 
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi página</title>

<style>
body{
  margin:0;
  padding:0;
  background:black;
  font-family:Arial, Helvetica, sans-serif;
  min-height:200vh;
}

/* FOTO CENTRAL */
.fotoCentral{
  display:block;
  width:900px;
  margin:auto;
  margin-top:-150px;
  position:relative;
  left:-218px;
  top:20px;
}

/* BOTONES EXISTENTES */
.botonSpotify{ position:fixed; top:40px; right:56px; z-index:9999;}
.botonSpotify img{ width:450px; border-radius:20px; box-shadow:0 10px 25px rgba(0,0,0,0.4); transition:0.3s;}
.botonSpotify img:hover{ transform:scale(1.08);}

.botonYoutube{ position:fixed; top:238px; right:151px; z-index:9999;}
.botonYoutube img{ width:280px; border-radius:20px; box-shadow:0 10px 25px rgba(0,0,0,0.4); transition:0.3s;}
.botonYoutube img:hover{ transform:scale(1.08);}

.botonApple{ position:fixed; top:396px; right:132px; z-index:9999;}
.botonApple img{ width:305px; border-radius:20px; box-shadow:0 10px 25px rgba(0,0,0,0.4); transition:0.3s;}
.botonApple img:hover{ transform:scale(1.08);}

/* BOTON DESCARGA */
.botonDescarga{ position:fixed; top:540px; right:132px; z-index:9999;}
.botonDescarga img{ width:305px; cursor:pointer; transition:0.3s;}
.botonDescarga img:hover{ transform:scale(1.08);}

/* LOGO */
.logoFijo{ position:fixed; top:4px; left:-10px; z-index:99999;}
.logoFijo img{ width:110px; }

/* SPOTIFY EMBED */
.spotifyEmbed{ display:flex; justify-content:center; }

@media (min-width:769px){
  .spotifyEmbed{ transform: translate(-217px, 33px); }
}

/* CELULAR */
@media (max-width:768px){
  body{ min-height:180vh; overflow-x:hidden; }
  .fotoCentral{ width:85vw; margin-top:81px; left:0; top:0;}

  .botonSpotify,.botonYoutube,.botonApple,.botonDescarga{
    position:static;
    display:block;
    margin:auto;
    width:300px;
  }

  .botonSpotify img,.botonYoutube img,.botonApple img,.botonDescarga img{
    width:300px;
  }

  .logoFijo{ top:10px; left:0; }
  .logoFijo img{ width:65px; }

  .spotifyEmbed{ transform: translate(0px, 350px); }
}

/* ===== MINI VENTANA REAL (NO MOLESTA) ===== */
.miniVentana{
  display:none;
  position:fixed;
  bottom:25px;
  right:25px;
  width:260px;
  background:#111;
  color:white;
  padding:14px;
  border-radius:12px;
  box-shadow:0 10px 25px rgba(0,0,0,0.6);
  z-index:999999;
  font-size:14px;
}

.miniVentana a{
  display:block;
  margin-top:10px;
  padding:10px;
  background:#1db954;
  color:black;
  text-align:center;
  text-decoration:none;
  border-radius:8px;
  font-weight:bold;
}

.cerrar{
  float:right;
  cursor:pointer;
  font-size:16px;
}
</style>
</head>

<body>

<img class="fotoCentral"
src="https://github.com/user-attachments/assets/ad66a631-bd77-42d9-af9e-fbd95b66f24e">

<a class="botonSpotify" href="https://open.spotify.com/artist/1YTUjUT54hysCojyJUrCRs" target="_blank">
<img src="https://github.com/user-attachments/assets/9cf817a2-2271-45cd-b2f4-93a8ec1aa662">
</a>

<a class="botonYoutube" href="https://youtu.be/LhNoNp9qEiQ" target="_blank">
<img src="https://github.com/user-attachments/assets/0425b689-3d8f-4387-b4fb-d4c4a2ce8930">
</a>

<a class="botonApple" href="https://music.apple.com/mx/song/solo/1706135810" target="_blank">
<img src="https://github.com/user-attachments/assets/67ba3a7a-83b2-4675-9393-7de6fa176470">
</a>

<div class="botonDescarga">
  <img id="imgDescarga"
  src="https://github.com/user-attachments/assets/4dcc798c-a448-43d3-b034-6196688c053f"
  onclick="abrirMini()">
</div>

<div class="spotifyEmbed">
  <iframe style="border-radius:12px" 
  src="https://open.spotify.com/embed/playlist/5H4YBJmZKajvJnANiswCvX" 
  width="60%" height="80" frameborder="0"
  allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
  </iframe>
</div>

<div class="logoFijo">
  <img src="https://github.com/user-attachments/assets/f1a56ada-5a62-432b-9f2b-3da43e0b8544">
</div>

<!-- MINI VENTANA -->
<div id="miniVentana" class="miniVentana">
  <span class="cerrar" onclick="cerrarMini()">✕</span>
  <b>DESCARGA DESBLOQUEADA 🚀</b>

  <a id="linkFinal" href="#" target="_blank">IR A DESCARGA</a>
</div>

<script>

const linkDescarga = "https://mega.nz/folder/7vxDmDCC#6rkxkdLm9xoP234xWUjp1g";

function abrirMini(){
  document.getElementById("miniVentana").style.display = "block";
  document.getElementById("linkFinal").href = linkDescarga;
}

function cerrarMini(){
  document.getElementById("miniVentana").style.display = "none";
}

</script>

</body>
</html>
