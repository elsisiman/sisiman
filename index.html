<style>
  /* El selector 'body' aplica el cambio a TODA la pantalla */
  body {
    background-color: #000000 !important; /* Negro absoluto */
    color: #ffffff; /* Letras blancas para que se puedan leer */
    margin: 0;
    padding: 0;
  }

  /* Opcional: Esto hace que los enlaces se vean mejor sobre negro */
  a {
    color: #1DB954; /* Color verde (como el de Spotify) para resaltar */
  }
</style>

<!-- ESTO ES EL MARCO QUE FALTABA -->
<div class="contenedor-imagen-total">
  <style>
    .contenedor-imagen-total {
      display: flex; /* Mágia para centrar y ajustar */
      justify-content: center; /* Centra horizontalmente */
      align-items: center; /* Centra verticalmente */
      width: 100%; /* Todo el ancho de la pantalla */
      height: 100vh; /* Todo el alto de la pantalla visible */
      background-color: transparent; /* Fondo transparente */
      overflow: hidden; /* Evita que salgan barras de desplazamiento si la foto es gigante */
    }

    .foto-movible {
      position: relative; /* Cambié 'fixed' por 'relative' para que se ajuste al contenedor */
      
      /* AJUSTA ESTOS NÚMEROS SI QUIERES MOVERLA DESDE EL CENTRO */
      top: 0px; /* Sube si es negativo (-20px), baja si es positivo */
      left: -70px; /* Izquierda si es negativo, derecha si es positivo */

      /* TAMAÑO INTELIGENTE: Nunca más grande que su ancho original ni que la pantalla */
      width: auto;
      max-width: 8000px; /* Cambia este número para el tamaño máximo que quieras (ej. 400px o 800px) */
      height: auto;
      max-height: 98vh; /* Nunca más alta que el 90% de la pantalla */

      animation: flotar 3s ease-in-out infinite;
      z-index: 999;
      
      /* Asegura que la imagen no se estire feo */
      object-fit: contain;
    }

    @keyframes flotar {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }
  </style>

  <img class="foto-movible" 
       alt="imagen" 
       src="https://github.com/user-attachments/assets/3c320006-1971-4a02-89d2-06eecc2dff8b" />
</div>
