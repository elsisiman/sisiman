<style>
  /* El selector 'body' aplica el cambio a TODA la pantalla */
  body {
    background-color: #000000 !important; /* Negro absoluto */
    color: #ffffff; /* Letras blancas para que se puedan leer */
    margin: 0;
    padding: 0;
  }

  /* Opcional: Esto hace que los enlaces se vean mejor sobre negro */
  a {
    color: #1DB954; /* Color verde (como el de Spotify) para resaltar */
  }
</style>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Imagen Movible</title>

<style>
  body{
    background:white;
    height:120vh;
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
  }

  .imagen{
    width:120px;   /* 🔎 CAMBIA EL TAMAÑO AQUÍ */
    position:fixed;

    left:-15px;      /* 👉 DERECHA (+) IZQUIERDA (-) */
    top:4px;       /* 👇 ABAJO (+) ARRIBA (-) */

    transition:0.3s;
  }
</style>
</head>

<body>

<img class="imagen"
src="https://github.com/user-attachments/assets/f1a56ada-5a62-432b-9f2b-3da43e0b8544">

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Imagen adaptable</title>

<style>
  body{
    background:white;
    margin:0;
    padding:40px;
  }

  /* 💻 COMPUTADORA (puedes moverla libre) */
  .logo{
    width:400px;       
    margin-top:100px;  
    margin-left:100px; 
  }

  /* 📱 CELULAR (siempre centrada) */
  @media (max-width: 768px){
    .logo{
      display:block;
      margin:40px auto;   /* centra horizontal */
      width:80%;          /* tamaño adaptable */
    }
  }

</style>
</head>

<body>

<img class="logo"
src="https://github.com/user-attachments/assets/ad66a631-bd77-42d9-af9e-fbd95b66f24e">

</body>
</html>
