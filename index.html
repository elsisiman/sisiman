<style>
body{
  margin:0;
  padding:0;
  background:black;
  font-family:Arial, Helvetica, sans-serif;
  min-height:200vh;
}

/* FOTO CENTRAL */
.fotoCentral{
  display:block;
  width:900px;
  margin:auto;
  margin-top:-150px;
  position:relative;
  left:-218px;
  top:20px;
}

/* BOTONES EXISTENTES */
.botonSpotify{ position:fixed; top:18px; right:56px; z-index:9999;}
.botonSpotify img{ width:450px; border-radius:20px; box-shadow:0 10px 25px rgba(0,0,0,0.4); transition:0.3s;}
.botonSpotify img:hover{ transform:scale(1.08);}

.botonYoutube{ position:fixed; top:217px; right:151px; z-index:9999;}
.botonYoutube img{ width:280px; border-radius:20px; box-shadow:0 10px 25px rgba(0,0,0,0.4); transition:0.3s;}
.botonYoutube img:hover{ transform:scale(1.08);}

.botonApple{ position:fixed; top:376px; right:132px; z-index:9999;}
.botonApple img{ width:305px; border-radius:20px; box-shadow:0 10px 25px rgba(0,0,0,0.4); transition:0.3s;}
.botonApple img:hover{ transform:scale(1.08);}

/* BOTON DESCARGA */
.botonDescarga{ position:fixed; top:520px; right:127px; z-index:9999;}
.botonDescarga img{ width:305px; cursor:pointer; transition:0.3s;}
.botonDescarga img:hover{ transform:scale(1.08);}

/* LOGO */
.logoFijo{ position:fixed; top:4px; left:-10px; z-index:99999;}
.logoFijo img{ width:110px; }

/* BOTONES TIENDA Y WHATSAPP */
.botonTienda, .botonWhatsApp { position: fixed; left: 50px; z-index: 99999; text-align: left;}
.botonTienda { top: 122px; }
.botonWhatsApp { top: 160px; }

.botonTienda a, .botonWhatsApp a{
  display: inline-block;
  text-decoration: none;
  background-color: transparent; 
  color: #ffffff;
  padding: 8px 15px; 
  font-family: Arial, sans-serif;
  font-size: 15px;
  font-weight: bold;
  border: none; 
  border-radius: 0;
  text-transform: uppercase;
  transition: 0.3s; 
  letter-spacing: 1px; 
}
.botonTienda a:hover, .botonWhatsApp a:hover{ 
  transform: scale(1.08); 
}

/* SPOTIFY EMBED */
.spotifyEmbed{ display:flex; justify-content:center; }

/* ESTILOS BASE DE LOS TEXTOS */
.seccionTexto, .seccionTexto2 {
  color: #e0e0e0;        
  font-size: 16px;       
  line-height: 1.6;      
  z-index: 1;
  font-family: 'Arial', sans-serif; 
}

/* AJUSTES PARA PC */
@media (min-width:769px){
  .spotifyEmbed{ transform: translate(-216px, 28px); }
  body { min-height: 250vh; }
  .seccionTexto { width: 445px; text-align: left; margin-top: 31px; margin-left: 90px; }
  .seccionTexto2 { width: 400px; text-align: left; margin-top: -3px; margin-left: 89px; }
}

/* CELULAR */
@media (max-width:768px){
  body{ min-height:221vh; overflow-x:hidden; }
  .fotoCentral{ width:85vw; margin-top:81px; left:0; top:0;}
  .botonSpotify { position: absolute; top: 570px; right: 14px; width: 330px; display: block; margin: 0; }
  .botonYoutube { position: absolute; top: 743px; right: 68px; width: 232px; display: block; margin: 0; }
  .botonApple { position: absolute; top: 903px; right: 47px; width: 260px; display: block; margin: 0; }
  .botonDescarga { position: absolute; top: 1043px; right: 23px; width: 310px; display: block; margin: 0; }
  .botonSpotify img, .botonYoutube img, .botonApple img, .botonDescarga img { width: 100%; }
  .logoFijo{ top:10px; left:0; }
  .logoFijo img{ width:65px; }
  
  .botonTienda { top: 44px; left: 50px; }
  .botonWhatsApp { top: 82px; left: 50px; }
  .botonTienda a, .botonWhatsApp a{ padding: 8px 15px; font-size: 15px; }
  
  .spotifyEmbed { position: absolute; transform: none; display: block; top: 1254px; left: 2vw; width: 90vw; }
  .spotifyEmbed iframe { width: 105% !important; height: 80px; }
  .seccionTexto { position: absolute; top: 1338px; left: -8vw; width: 85vw; text-align: center; }
  .seccionTexto2 { position: absolute; top: 1359px; left: -26vw; width: 83vw; text-align: center; }
}
</style>
