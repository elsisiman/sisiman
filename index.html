<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi página</title>

<style>
body{
  margin:0;
  padding:0;
  background:black;
  font-family:Arial, Helvetica, sans-serif;
}

/* FOTO CENTRAL */
.fotoCentral{
  display:block;
  width:500px;
  margin:auto;
  margin-top:120px;
}

/* BOTON SPOTIFY PC */
.botonSpotify{
  position:fixed;
  top:20px;
  right:20px;
  z-index:9999;
}

.botonSpotify img{
  width:260px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.4);
  transition:0.3s;
}

.botonSpotify img:hover{
  transform:scale(1.08);
}

/* ===== LOGO PC (GRANDE + CONTROLES) ===== */
.logoFijo{
  position:fixed;
  top:-2px;   /* 🔧 mover vertical PC */
  left:-10px;  /* 🔧 mover horizontal PC */
  z-index:99999;
}

.logoFijo img{
  width:110px;   /* 🔥 LOGO MAS GRANDE EN PC */
}

/* 📱 MODO CELULAR */
@media (max-width: 768px){

  body{
    height:1300px;
  }

  .fotoCentral{
    width:85vw;
    margin-top:81px;
  }

  .botonSpotify{
    position:static;
    display:block;
    margin:auto;
    margin-top:0px;
    width:300px;
  }

  .botonSpotify img{
    width:300px;
    border-radius:18px;
  }

  /* LOGO SOLO CELULAR */
  .logoFijo{
    position:fixed;
    top:10px;   /* 🔧 mover solo celular */
    left:0px;   /* 🔧 mover solo celular */
  }

  .logoFijo img{
    width:65px;
  }
}
</style>
</head>

<body>

<img class="fotoCentral"
src="https://github.com/user-attachments/assets/ad66a631-bd77-42d9-af9e-fbd95b66f24e">

<a class="botonSpotify"
href="https://open.spotify.com/intl-es/track/1xm343jLVRrE6F3seWr5OP?context=spotify:playlist:5H4YBJmZKajvJnANiswCvX&si=PnNy9WOSQ8eAfIXm5clv4Q"
target="_blank" rel="noopener">
<img src="https://github.com/user-attachments/assets/9cf817a2-2271-45cd-b2f4-93a8ec1aa662">
</a>

<div class="logoFijo">
  <img src="https://github.com/user-attachments/assets/f1a56ada-5a62-432b-9f2b-3da43e0b8544">
</div>

</body>
</html>
