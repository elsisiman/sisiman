<style>
  /* El selector 'body' aplica el cambio a TODA la pantalla */
  body {
    background-color: #000000 !important; /* Negro absoluto */
    color: #ffffff; /* Letras blancas para que se puedan leer */
    margin: 0;
    padding: 0;
  }

  /* Opcional: Esto hace que los enlaces se vean mejor sobre negro */
  a {
    color: #1DB954; /* Color verde (como el de Spotify) para resaltar */
  }
</style>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Imagen Movible</title>

<style>
  body{
    background:white;
    height:110vh;
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
  }

  .imagen{
    width:150px;   /* 🔎 CAMBIA EL TAMAÑO AQUÍ */
    position:fixed;

    left:-20px;      /* 👉 DERECHA (+) IZQUIERDA (-) */
    top:3px;       /* 👇 ABAJO (+) ARRIBA (-) */

    transition:0.3s;
  }
</style>
</head>

<body>

<img class="imagen"
src="https://github.com/user-attachments/assets/f1a56ada-5a62-432b-9f2b-3da43e0b8544">

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imagen fija</title>

<style>
  body{
    background:white;
    margin:0;
  }

  /* 📍 POSICIÓN NORMAL (PC) */
  .logo{
    display:block;
    width:700px;        /* tamaño PC */

    margin-top:50px;   /* mover arriba/abajo PC */
    margin-left:-550px;  /* mover izquierda/derecha PC */
  }

  /* 📱 AJUSTES CELULAR */
  @media (max-width:768px){
    .logo{
      width:768px;        /* tamaño celular */

      margin-top:100px;    /* mover arriba/abajo celular */
      margin-left:295px;   /* mover izquierda/derecha celular */
    }
  }

</style>
</head>

<body>

<img class="logo"
src="https://github.com/user-attachments/assets/ad66a631-bd77-42d9-af9e-fbd95b66f24e">

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Botón Spotify Movible</title>

<style>
  body{
    height:200vh;
    margin:0;
    background:white;
    font-family:Arial, Helvetica, sans-serif;
  }

  /* BOTON */
  .spotify-btn{
    position:fixed;          /* 🔥 esto permite moverlo libre por la pantalla */
    top:150px;               /* 👉 CAMBIA posición vertical */
    left:150px;              /* 👉 CAMBIA posición horizontal */

    padding:18px 30px;       /* 👉 CAMBIA tamaño del botón */
    font-size:20px;          /* 👉 CAMBIA tamaño del texto */

    color:white;
    text-decoration:none;
    border-radius:50px;
    background:linear-gradient(45deg,#1DB954,#1ed760);
    box-shadow:0 10px 25px rgba(0,0,0,0.25);
    transition:0.3s;
    font-weight:bold;
  }

  .spotify-btn:hover{
    transform:scale(1.1);
    box-shadow:0 15px 35px rgba(0,0,0,0.35);
  }
</style>
</head>

<body>

<a class="spotify-btn"
href="spotify:track:1xm343jLVRrE6F3seWr5OP?context=spotify:playlist:5H4YBJmZKajvJnANiswCvX&si=PnNy9WOSQ8eAfIXm5clv4Q"
onclick="window.location.href='https://open.spotify.com/track/1xm343jLVRrE6F3seWr5OP?context=spotify:playlist:5H4YBJmZKajvJnANiswCvX&si=PnNy9WOSQ8eAfIXm5clv4Q'; return false;">
🎵 Escuchar en Spotify
</a>

</body>
</html>
