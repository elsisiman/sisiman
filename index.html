<style>
body{
  margin:0;
  padding:0;

  font-family:Arial, Helvetica, sans-serif;

}

/* FOTO CENTRAL */
.fotoCentral{
  display:block;
  width:900px;
  margin:auto;
  margin-top:-150px;
  position:relative;
  left:-218px;
  top:20px;
}

/* BOTONES EXISTENTES */
.botonSpotify{ position:fixed; top:18px; right:56px; z-index:9999;}
.botonSpotify img{ width:450px; border-radius:20px; box-shadow:0 10px 25px rgba(0,0,0,0.4); transition:0.3s;}
.botonSpotify img:hover{ transform:scale(1.08);}

.botonYoutube{ position:fixed; top:217px; right:151px; z-index:9999;}
.botonYoutube img{ width:280px; border-radius:20px; box-shadow:0 10px 25px rgba(0,0,0,0.4); transition:0.3s;}
.botonYoutube img:hover{ transform:scale(1.08);}

.botonApple{ position:fixed; top:376px; right:132px; z-index:9999;}
.botonApple img{ width:305px; border-radius:20px; box-shadow:0 10px 25px rgba(0,0,0,0.4); transition:0.3s;}
.botonApple img:hover{ transform:scale(1.08);}

/* BOTON DESCARGA */
.botonDescarga{ position:fixed; top:520px; right:127px; z-index:9999;}
.botonDescarga img{ width:305px; cursor:pointer; transition:0.3s;}
.botonDescarga img:hover{ transform:scale(1.08);}

/* LOGO */
.logoFijo{ position:fixed; top:4px; left:-10px; z-index:99999;}
.logoFijo img{ width:110px; }

/* SPOTIFY EMBED */
.spotifyEmbed{ display:flex; justify-content:center; }


/* =======================================================
   ESTILOS BASE DE LOS DOS TEXTOS NORMALES
   ======================================================= */
.seccionTexto, .seccionTexto2 {
  color: #e0e0e0;        
  font-size: 16px;       
  line-height: 1.6;      
  z-index: 1;
  font-family: 'Arial', sans-serif; 
}


/* AJUSTES PARA PC */
@media (min-width:769px){
  .spotifyEmbed{ transform: translate(-216px, 28px); }

  /* CONTROL DE SCROLL EXCLUSIVO PARA PC */
  body { 
    min-height: 250vh; 
  }

  /* TEXTO 1: Mueve libremente "cantondecarton" */
  .seccionTexto {
    width: 445px;
    text-align: left;      
    margin-top: 31px;      /* Espacio abajo desde el embed */
    margin-left: 90px;    /* Espacio desde la orilla izquierda */
  }

  /* TEXTO 2: Mueve libremente "3125951818" */
  .seccionTexto2 {
    width: 400px;
    text-align: left;      
    margin-top: -3px;      /* Espacio abajo desde el primer texto */
    margin-left: 89px;    /* Espacio desde la orilla izquierda */
  }
}

/* CELULAR */
@media (max-width:768px){
  /* AUMENTADO: Le damos más altura al fondo de la página para que puedas bajar libremente */
  body{ min-height:280vh; overflow-x:hidden; }
  
  .fotoCentral{ width:85vw; margin-top:81px; left:0; top:0;}

  /* 1. CONTROL PARA EL BOTÓN DE SPOTIFY EN CELULAR */
  .botonSpotify {
    position: absolute;
    top: 541px;          
    right: 14px;         
    width: 330px;        
    display: block;
    margin: 0;
  }

  /* 2. CONTROL PARA EL BOTÓN DE YOUTUBE EN CELULAR */
  .botonYoutube {
    position: absolute;   
    top: 683px;          
    right: 68px;         
    width: 232px;        
    display: block;
    margin: 0;
  }

  /* 3. CONTROL PARA EL BOTÓN DE APPLE MUSIC EN CELULAR */
  .botonApple {
    position: absolute;
    top: 817px;          
    right: 47px;         
    width: 260px;        
    display: block;
    margin: 0;
  }

  /* 4. CONTROL PARA EL BOTÓN DE DESCARGA EN CELULAR */
  .botonDescarga {
    position: absolute;
    top: 945px;          
    right: 34px;         
    width: 310px;        
    display: block;
    margin: 0;
  }

  /* Hace que todas las imágenes obedezcan al ancho (width) asignado arriba */
  .botonSpotify img, .botonYoutube img, .botonApple img, .botonDescarga img {
    width: 100%;
  }

  .logoFijo{ top:10px; left:0; }
  .logoFijo img{ width:65px; }


  /* =======================================================
     NUEVO CONTROL TOTAL DEL EMBED DE SPOTIFY EN CELULAR
     ======================================================= */
  .spotifyEmbed { 
    position: absolute;
    transform: none; /* Elimina herencias del diseño de PC */
    display: block;

    /* MODIFICA ESTOS VALORES PARA MOVER Y REDIMENSIONAR EL REPRODUCTOR: */
    top: 1450px;       /* Controla la altura en la página (bájalo o súbelo aquí) */
    left: 10vw;       /* Margen desde la izquierda (usa 'vw' o 'px') */
    width: 80vw;      /* Cambia el ANCHO total del reproductor en el cel */
  }
  
  /* Fuerza al cuadro interno del reproductor a obedecer al control de arriba */
  .spotifyEmbed iframe {
    width: 100% !important;
    height: 80px;     /* Cambia este número si quieres modificar la ALTURA del reproductor */
  }


  /* NUEVO CONTROL EXCLUSIVO PARA EL PRIMER TEXTO (CORREO) EN CELULAR */
  .seccionTexto {
    position: absolute;
    
    /* MODIFICA ESTOS VALORES PARA MOVER EL CORREO: */
    top: 1650px;         /* Sube este número (ej. 1200px) para bajarlo todo lo que quieras */
    left: 7.5vw;        /* Lo centra perfectamente en pantallas de cel */
    
    width: 85vw;
    text-align: center;
  }

  /* NUEVO CONTROL EXCLUSIVO PARA EL SEGUNDO TEXTO (TELÉFONO) EN CELULAR */
  .seccionTexto2 {
    position: absolute;
    
    /* MODIFICA ESTOS VALORES PARA MOVER EL TELÉFONO: */
    top: 1700px;         /* Controla la altura del teléfono en el celular */
    left: 7.5vw;        /* Lo centra perfectamente en pantallas de cel */
    
    width: 85vw;
    text-align: center;
  }
}
</style>

<script>
const client_id = "f10cb7ef8c5b4ad8bbf15eaf2a239e8d";
const redirect_uri = "https://sisiman.vercel.app";
const artist_id = "5KeX79pQzo2M92PKqjOhxo";
const playlist_id = "5H4YBJmZKajvJnANiswCvX";

const linkDescarga = "https://mega.nz/folder/7vxDmDCC#6rkxkdLm9xoP234xWUjp1g";
const imgDesbloqueado = "https://github.com/user-attachments/assets/9848879b-01bd-47fd-8895-898216feb2e0";

let tokenSpotify = localStorage.getItem("spotify_token");

function seguirSpotify(){
  const scope = "user-follow-read playlist-read-private";

  const auth_url =
  "https://accounts.spotify.com/authorize"+
  "?client_id="+client_id+
  "&response_type=code"+
  "&redirect_uri="+encodeURIComponent(redirect_uri)+
  "&scope="+encodeURIComponent(scope)+
  "&show_dialog=true";

  const ancho = 500;
  const alto = 650;
  const izquierda = (screen.width / 2) - (ancho / 2);
  const arriba = (screen.height / 2) - (alto / 2);

  window.open(auth_url, "SpotifyAuth", `width=${ancho},height=${alto},top=${arriba},left=${izquierda}`);
}

window.onload = () => {
  const urlParams = new URLSearchParams(window.location.search);
  const code = urlParams.get("code");

  if(code){
    if (window.opener) {
      window.opener.postMessage({ tipo: "SPOTIFY_CODE", code: code }, "*");
      window.close();
    } else {
      intercambiarCodePorToken(code);
    }
  }
}

window.addEventListener("message", (evento) => {
  if (evento.data && evento.data.tipo === "SPOTIFY_CODE") {
    intercambiarCodePorToken(evento.data.code);
  }
});

async function intercambiarCodePorToken(code){
  const body = new URLSearchParams({
    grant_type: "authorization_code",
    code: code,
    redirect_uri: redirect_uri,
    client_id: client_id
  });

  try {
    const respuesta = await fetch("https://accounts.spotify.com/api/token", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: body
    });

    const data = await respuesta.json();
    tokenSpotify = data.access_token;
    localStorage.setItem("spotify_token", tokenSpotify);
    
    window.history.replaceState({}, document.title, "/");
    desbloquearDescarga();
  } catch (error) {
    console.error("Error al obtener el token:", error);
  }
}

function desbloquearDescarga(){
  const img = document.getElementById("imgDescarga");
  img.src = imgDesbloqueado;
  img.onclick = () => window.open(linkDescarga, "_blank");
  alert("DESCARGA DESBLOQUEADA 🚀");
}
</script>
