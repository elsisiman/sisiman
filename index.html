<style>
  /* El selector 'body' aplica el cambio a TODA la pantalla */
  body {
    background-color: #000000 !important; /* Negro absoluto */
    color: #ffffff; /* Letras blancas para que se puedan leer */
    margin: 0;
    padding: 0;
  }

  /* Opcional: Esto hace que los enlaces se vean mejor sobre negro */
  a {
    color: #1DB954; /* Color verde (como el de Spotify) para resaltar */
  }
</style>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Imagen Movible</title>

<style>
  body{
    background:white;
    height:110vh;
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
  }

  .imagen{
    width:120px;   /* 🔎 CAMBIA EL TAMAÑO AQUÍ */
    position:fixed;

    left:-15px;      /* 👉 DERECHA (+) IZQUIERDA (-) */
    top:4px;       /* 👇 ABAJO (+) ARRIBA (-) */

    transition:0.3s;
  }
</style>
</head>

<body>

<img class="imagen"
src="https://github.com/user-attachments/assets/f1a56ada-5a62-432b-9f2b-3da43e0b8544">

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Imagen adaptable PRO</title>

<style>
  body{
    background:white;
    margin:0;
    padding:0; /* quitamos padding que rompía el movimiento */
  }

  /* CAJA QUE CONTROLA LA POSICIÓN */
  .contenedor{
    width:100%;
  }

  /* 💻 POSICIÓN EN COMPUTADORA */
  .mover-pc{
    margin-top:100px;   /* mover vertical PC */
    margin-left:120px;  /* mover horizontal PC */
  }

  /* 📱 POSICIÓN EN CELULAR */
  @media (max-width:768px){
    .mover-pc{
      margin-top:40px;   /* mover vertical celular */
      margin-left:20px;  /* mover horizontal celular */
    }
  }

  /* IMAGEN */
  .logo{
    width:400px;  /* tamaño PC */
  }

  /* TAMAÑO EN CELULAR */
  @media (max-width:768px){
    .logo{
      width:500px;  /* tamaño celular */
    }
  }

</style>
</head>

<body>

<div class="contenedor mover-pc">
  <img class="logo"
  src="https://github.com/user-attachments/assets/ad66a631-bd77-42d9-af9e-fbd95b66f24e">
</div>

</body>
</html>
