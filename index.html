<style>
  /* El selector 'body' aplica el cambio a TODA la pantalla */
  body {
    background-color: #000000 !important; /* Negro absoluto */
    color: #ffffff; /* Letras blancas para que se puedan leer */
    margin: 0;
    padding: 0;
  }

  /* Opcional: Esto hace que los enlaces se vean mejor sobre negro */
  a {
    color: #1DB954; /* Color verde (como el de Spotify) para resaltar */
  }
</style>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Imagen Movible</title>

<style>
  body{
    background:white;
    height:110vh;
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
  }

  .imagen{
    width:150px;   /* 🔎 CAMBIA EL TAMAÑO AQUÍ */
    position:fixed;

    left:-20px;      /* 👉 DERECHA (+) IZQUIERDA (-) */
    top:3px;       /* 👇 ABAJO (+) ARRIBA (-) */

    transition:0.3s;
  }
</style>
</head>

<body>

<img class="imagen"
src="https://github.com/user-attachments/assets/f1a56ada-5a62-432b-9f2b-3da43e0b8544">

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Botón Spotify Imagen</title>

<style>
  body{
    height:200vh;
    margin:0;
    background:white;
  }

  .spotify-btn{
    position:fixed;
    top:150px;
    left:150px;
    display:inline-block;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,0.25);
    transition:0.3s;
    cursor:pointer;
  }

  .spotify-btn img{
    width:420px;   /* CAMBIA TAMAÑO AQUÍ */
    display:block;
  }

  .spotify-btn:hover{
    transform:scale(1.08);
    box-shadow:0 15px 35px rgba(0,0,0,0.35);
  }
</style>
</head>

<body>

<a class="spotify-btn"
onclick="window.open('https://open.spotify.com/track/1xm343jLVRrE6F3seWr5OP?context=spotify:playlist:5H4YBJmZKajvJnANiswCvX&si=PnNy9WOSQ8eAfIXm5clv4Q','_blank')">

<img src="https://i.imgur.com/2w6Qw7H.png">

</a>

</body>
</html>
