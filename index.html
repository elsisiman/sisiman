<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mi página</title>

<style>

/* QUITA márgenes del navegador */
body{
  margin:0;
  padding:0;
  background:black; /* fondo negro total */
}

/* 🖼️ FOTO CENTRAL (fondo visual) */
.foto{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  
  width:500px;   /* 👉 tamaño de tu foto */
  z-index:1;     /* capa media */
}

/* 🎵 BOTÓN SPOTIFY FLOTANTE */
.botonSpotify{
  position:fixed;
  top:350px;   /* 👉 mueve vertical */
  left:20px;  /* 👉 mueve horizontal */

  z-index:9999; /* 🔥 SIEMPRE ENCIMA DE TODO */
}

.botonSpotify img{
  width:260px;  /* 👉 tamaño del botón */
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.4);
  transition:0.3s;
}

/* efecto hover */
.botonSpotify img:hover{
  transform:scale(1.08);
}

</style>
</head>

<body>

<!-- FOTO CENTRAL -->
<img class="foto"
src="https://github.com/user-attachments/assets/ad66a631-bd77-42d9-af9e-fbd95b66f24e">

<!-- BOTÓN CON TU IMAGEN -->
<a class="botonSpotify"
href="https://open.spotify.com/track/1xm343jLVRrE6F3seWr5OP"
target="_blank">

<img src="https://github.com/user-attachments/assets/9cf817a2-2271-45cd-b2f4-93a8ec1aa662">

</a>

</body>
</html>
