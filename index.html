<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mi página</title>

<style>

/* 🔵 ELIMINA márgenes del navegador para que todo ocupe la pantalla */
body{
  margin:0;
  padding:0;
}

/* 🟢 CAPA 1 — FONDO NEGRO (pantalla completa) */
.fondo-negro{
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  background:#000;   /* 👉 color del fondo */
  z-index:0;
}

/* 🟡 CAPA 2 — TU FOTO EN EL CENTRO */
.foto{
  position:fixed;

  top:50%;     /* 👉 mueve arriba/abajo */
  left:50%;    /* 👉 mueve izquierda/derecha */

  transform:translate(-50%,-50%); /* centra perfecto */

  width:350px; /* 👉 CAMBIA TAMAÑO DE TU FOTO AQUÍ */
  z-index:1;
}

/* 🟣 CAPA 3 — BOTÓN SPOTIFY FLOTANTE */
.logo{
  position:fixed;

  top:20px;   /* 👉 mueve vertical (arriba/abajo) */
  left:20px;  /* 👉 mueve horizontal (izquierda/derecha) */

  width:70px; /* 👉 tamaño del botón */
  z-index:2;
}

/* ✨ efecto al pasar el mouse */
.logo:hover{
  transform:scale(1.1);
}

</style>
</head>

<body>

<!-- FONDO NEGRO -->
<div class="fondo-negro"></div>

<!-- TU FOTO -->
<img class="foto"
src="https://github.com/user-attachments/assets/ad66a631-bd77-42d9-af9e-fbd95b66f24e">

<!-- BOTÓN QUE ABRE SPOTIFY EN OTRA PESTAÑA -->
<a href="https://open.spotify.com/track/1xm343jLVRrE6F3seWr5OP" target="_blank">
  <img class="logo"
  src="https://upload.wikimedia.org/wikipedia/commons/8/84/Spotify_icon.svg">
</a>

</body>
</html>
