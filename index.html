<script>
const client_id = "f10cb7ef8c5b4ad8bbf15eaf2a239e8d";
const redirect_uri = "https://sisiman.vercel.app";
const artist_id = "5KeX79pQzo2M92PKqjOhxo";
const playlist_id = "5H4YBJmZKajvJnANiswCvX";

const linkDescarga = "https://mega.nz/folder/7vxDmDCC#6rkxkdLm9xoP234xWUjp1g";
const imgDesbloqueado = "https://github.com/user-attachments/assets/9848879b-01bd-47fd-8895-898216feb2e0";

let tokenSpotify = localStorage.getItem("spotify_token");

function forzarApp(e, urlApp, urlWeb, eventoMeta) {
  const ua = navigator.userAgent;
  const esAppleMovil = /iPhone|iPad|iPod/i.test(ua);
  if (esAppleMovil && urlApp.startsWith('spotify:')) {
    enviarA_API(eventoMeta);
    window.location.href = urlApp;
    return;
  }
  if (e && typeof e.preventDefault === 'function') {
    e.preventDefault(); 
  }
  enviarA_API(eventoMeta);
  const esMovil = /Android|iPhone|iPad|iPod/i.test(ua);
  const esChromeMovil = esMovil && (/Chrome/i.test(ua) || /CriOS/i.test(ua)) && !/FB_IAB|FBAN|FBAV/i.test(ua);
  setTimeout(() => {
    if (esChromeMovil && urlApp.startsWith('music:')) {
      window.open(urlWeb, '_blank');
      return;
    }
    if (esMovil) {
      window.location.href = urlApp;
      if (urlApp.startsWith('music:')) {
        setTimeout(() => {
          window.location.href = "https://music.apple.com/mx/song/solo/1706135810";
        }, 1200);
      }
    } else {
      window.open(urlWeb, '_blank');
    }
  }, 250);
}

function enviarA_API(nombreEvento) {
  const pixelId = '1574777457157001';
  if (typeof fbq === 'function') {
    fbq('track', nombreEvento);
  }
  const cacheBuster = Math.floor(Math.random() * 1000000);
  const eventosEstandar = ['PageView', 'ViewContent', 'Search', 'AddToCart', 'AddToWishlist', 'InitiateCheckout', 'AddPaymentInfo', 'Purchase', 'Lead', 'CompleteRegistration', 'Subscribe', 'Contact', 'CustomizeProduct', 'FindLocation', 'Schedule', 'StartTrial', 'SubmitApplication'];
  const parametroEvento = eventosEstandar.includes(nombreEvento) ? `ev=${nombreEvento}` : `ev=CustomEvent&cd[custom_event_name]=${nombreEvento}`;
  const urlFallback = `https://www.facebook.com/tr?id=${pixelId}&${parametroEvento}&noscript=1&cb=${cacheBuster}`;
  const imgTracker = new Image();
  imgTracker.src = urlFallback;
}

function seguirSpotify(){
  enviarA_API('CLIK DESCARGA');
  const scope = "user-follow-read playlist-read-private";
  const auth_url = "https://accounts.spotify.com/authorize"+ "?client_id="+client_id+ "&response_type=code"+ "&redirect_uri="+encodeURIComponent(redirect_uri)+ "&scope="+encodeURIComponent(scope)+ "&show_dialog=true";
  const ancho = 500;
  const alto = 650;
  const izquierda = (screen.width / 2) - (ancho / 2);
  const arriba = (screen.height / 2) - (alto / 2);
  window.open(auth_url, "SpotifyAuth", `width=${ancho},height=${alto},top=${arriba},left=${izquierda}`);
}

window.onload = () => {
  const urlParams = new URLSearchParams(window.location.search);
  const code = urlParams.get("code");
  if(code){
    if (window.opener) {
      window.opener.postMessage({ tipo: "SPOTIFY_CODE", code: code }, "*");
      window.close();
    } else {
      intercambiarCodePorToken(code);
    }
  }
}

window.addEventListener("message", (evento) => {
  if (evento.data && evento.data.tipo === "SPOTIFY_CODE") {
    intercambiarCodePorToken(evento.data.code);
  }
});

async function intercambiarCodePorToken(code){
  const body = new URLSearchParams({
    grant_type: "authorization_code",
    code: code,
    redirect_uri: redirect_uri,
    client_id: client_id
  });
  try {
    const respuesta = await fetch("https://accounts.spotify.com/api/token", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: body
    });
    const data = await respuesta.json();
    tokenSpotify = data.access_token;
    localStorage.setItem("spotify_token", tokenSpotify);
    window.history.replaceState({}, document.title, "/");
    desbloquearDescarga();
  } catch (error) {
    console.error("Error al obtener el token:", error);
  }
}

function desbloquearDescarga(){
  enviarA_API('DESCARGA COMPLETADA');
  const img = document.getElementById("imgDescarga");
  img.src = imgDesbloqueado;
  img.onclick = () => window.open(linkDescarga, "_blank");
  alert("DESCARGA DESBLOQUEADA 🚀");
}
</script>
