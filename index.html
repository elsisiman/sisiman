<style>
  /* El selector 'body' aplica el cambio a TODA la pantalla */
  body {
    background-color: #000000 !important; /* Negro absoluto */
    color: #ffffff; /* Letras blancas para que se puedan leer */
    margin: 0;
    padding: 0;
  }

  /* Opcional: Esto hace que los enlaces se vean mejor sobre negro */
  a {
    color: #1DB954; /* Color verde (como el de Spotify) para resaltar */
  }
</style>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Imagen Movible</title>

<style>
  body{
    background:white;
    height:110vh;
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
  }

  .imagen{
    width:150px;   /* 🔎 CAMBIA EL TAMAÑO AQUÍ */
    position:fixed;

    left:-20px;      /* 👉 DERECHA (+) IZQUIERDA (-) */
    top:3px;       /* 👇 ABAJO (+) ARRIBA (-) */

    transition:0.3s;
  }
</style>
</head>

<body>

<img class="imagen"
src="https://github.com/user-attachments/assets/f1a56ada-5a62-432b-9f2b-3da43e0b8544">

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imagen fija</title>

<style>
  body{
    background:white;
    margin:0;
  }

  /* 📍 POSICIÓN NORMAL (PC) */
  .logo{
    display:block;
    width:700px;        /* tamaño PC */

    margin-top:-20px;   /* mover arriba/abajo PC */
    margin-left:-550px;  /* mover izquierda/derecha PC */
  }

  /* 📱 AJUSTES CELULAR */
  @media (max-width:768px){
    .logo{
      width:768px;        /* tamaño celular */

      margin-top:120px;    /* mover arriba/abajo celular */
      margin-left:295px;   /* mover izquierda/derecha celular */
    }
  }

</style>
</head>

<body>

<img class="logo"
src="https://github.com/user-attachments/assets/ad66a631-bd77-42d9-af9e-fbd95b66f24e">

</body>
</html>
