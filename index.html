<style>
  /* El selector 'body' aplica el cambio a TODA la pantalla */
  body {
    background-color: #000000 !important; /* Negro absoluto */
    color: #ffffff; /* Letras blancas para que se puedan leer */
    margin: 0;
    padding: 0;
  }

  /* Opcional: Esto hace que los enlaces se vean mejor sobre negro */
  a {
    color: #1DB954; /* Color verde (como el de Spotify) para resaltar */
  }
</style>

<style>
  .foto-movible {
    /* 1. Esto permite que la foto "flote" y la puedas mover */
    position: fixed; 

    /* 2. AJUSTA ESTOS NÚMEROS PARA MOVERLA */
    top: 0px;    /* Arriba / Abajo (Sube si es menor, baja si es mayor) */
    left: 0px;    /* Izquierda / Derecha (Se mueve a la derecha si es mayor) */

    /* 3. Tamaño de la foto */
    width: 1000px;  
    height: auto;
    
    /* 4. El movimiento animado que querías */
    animation: flotar 3s ease-in-out infinite;
    z-index: 999; /* Para que esté por encima de todo */
  }

  @keyframes flotar {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }
</style>
