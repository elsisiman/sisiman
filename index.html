<style>
  /* El selector 'body' aplica el cambio a TODA la pantalla */
  body {
    background-color: #000000 !important; /* Negro absoluto */
    color: #ffffff; /* Letras blancas para que se puedan leer */
    margin: 0;
    padding: 0;
  }

  /* Opcional: Esto hace que los enlaces se vean mejor sobre negro */
  a {
    color: #1DB954; /* Color verde (como el de Spotify) para resaltar */
  }
</style>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mi página</title>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:white;
}

/* ===== BOTON SPOTIFY ===== */
#spotifyBtn{
  position:fixed;
  top:20px;
  left:20px;
  cursor:grab;
  z-index:999999;
}
#spotifyBtn img{
  width:300px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,.25);
  transition:.2s;
}
#spotifyBtn img:hover{
  transform:scale(1.05);
}
</style>
</head>

<body>

<!-- TU PAGINA NORMAL -->
<h1 style="text-align:center;margin-top:120px;">
Tu página sigue intacta 👍
</h1>

<!-- ===== BOTON SPOTIFY FLOTANTE ===== -->
<a id="spotifyBtn"
href="https://open.spotify.com/track/1xm343jLVRrE6F3seWr5OP?context=spotify:playlist:5H4YBJmZKajvJnANiswCvX&si=PnNy9WOSQ8eAfIXm5clv4Q"
target="_blank">
<img id="spotifyImg"
src="https://github.com/user-attachments/assets/9cf817a2-2271-45cd-b2f4-93a8ec1aa662">
</a>

<script>
window.onload=function(){

const btn=document.getElementById("spotifyBtn");
const img=document.getElementById("spotifyImg");

let isDragging=false,offsetX,offsetY;

/* cargar memoria */
let x=localStorage.getItem("spotifyX");
let y=localStorage.getItem("spotifyY");
let s=localStorage.getItem("spotifySize");

if(x && y){btn.style.left=x+"px";btn.style.top=y+"px";}
if(s){img.style.width=s+"px";}

/* arrastrar */
btn.onmousedown=e=>{
  isDragging=true;
  offsetX=e.clientX-btn.offsetLeft;
  offsetY=e.clientY-btn.offsetTop;
};

document.onmousemove=e=>{
  if(!isDragging)return;
  btn.style.left=(e.clientX-offsetX)+"px";
  btn.style.top=(e.clientY-offsetY)+"px";
};

document.onmouseup=e=>{
  if(!isDragging)return;
  isDragging=false;
  localStorage.setItem("spotifyX",btn.offsetLeft);
  localStorage.setItem("spotifyY",btn.offsetTop);
};

/* zoom con rueda */
img.onwheel=e=>{
  e.preventDefault();
  let size=img.offsetWidth;
  size+=e.deltaY*-0.2;
  if(size<120)size=120;
  if(size>700)size=700;
  img.style.width=size+"px";
  localStorage.setItem("spotifySize",size);
};

};
</script>

</body>
</html>
