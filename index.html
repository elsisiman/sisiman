<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mi página</title>

<style>

/* ============================= */
/* 🎨 FONDO GENERAL DE LA PAGINA */
/* ============================= */
body{
  background-color:#000000;   /* color de fondo de TODA la web */
  color:#ffffff;              /* color del texto */
  margin:0;                   /* quita márgenes del navegador */
  padding:0;
  font-family:Arial, Helvetica, sans-serif;
}

/* color de los links */
a{
  color:#1DB954;
}


/* ============================= */
/* 🎵 CONTENEDOR DEL BOTON */
/* ============================= */
#spotifyBtn{
  position:fixed;   /* 🔥 hace que el botón flote en pantalla */
  top:20px;         /* 🔼 mueve el botón ARRIBA/ABAJO */
  left:20px;        /* ◀ mueve el botón IZQUIERDA/DERECHA */
  z-index:999999;   /* siempre encima de todo */
}


/* ============================= */
/* 🖼️ IMAGEN DEL BOTON */
/* ============================= */
#spotifyBtn img{
  width:300px;      /* 📏 CAMBIAR TAMAÑO DEL BOTON */
  border-radius:20px; /* bordes redondeados */
  box-shadow:0 10px 25px rgba(0,0,0,0.25); /* sombra */
  transition:0.3s;  /* animación suave */
}


/* ============================= */
/* ✨ EFECTO AL PASAR EL MOUSE */
/* ============================= */
#spotifyBtn img:hover{
  transform:scale(1.08); /* 🔍 agranda al pasar el mouse */
}

</style>
</head>

<body>

<!-- TEXTO DE PRUEBA -->
<h1 style="text-align:center;margin-top:120px;">
Tu página ya tiene fondo negro y botón 🎧
</h1>


<!-- ============================= -->
<!-- 🔗 BOTON QUE ABRE SPOTIFY -->
<!-- ============================= -->
<a id="spotifyBtn"
href="https://open.spotify.com/track/1xm343jLVRrE6F3seWr5OP?context=spotify:playlist:5H4YBJmZKajvJnANiswCvX&si=PnNy9WOSQ8eAfIXm5clv4Q"
target="_blank">  <!-- 🔥 abre en otra pestaña -->

<!-- 🖼️ IMAGEN DEL BOTON -->
<img src="https://github.com/user-attachments/assets/9cf817a2-2271-45cd-b2f4-93a8ec1aa662">

</a>

</body>
</html>
