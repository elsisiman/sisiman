<!DOCTYPE html> 
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi página</title>

<style>
body{
  margin:0;
  padding:0;
  background:black;
  font-family:Arial, Helvetica, sans-serif;
  min-height:200vh;
}

/* FOTO CENTRAL */
.fotoCentral{
  display:block;
  width:900px;
  margin:auto;
  margin-top:-150px;
  position:relative;
  left:-218px;
  top:20px;
}

/* BOTONES EXISTENTES */
.botonSpotify{ position:fixed; top:40px; right:56px; z-index:9999;}
.botonSpotify img{ width:450px; border-radius:20px; box-shadow:0 10px 25px rgba(0,0,0,0.4); transition:0.3s;}
.botonSpotify img:hover{ transform:scale(1.08);}

.botonYoutube{ position:fixed; top:238px; right:151px; z-index:9999;}
.botonYoutube img{ width:280px; border-radius:20px; box-shadow:0 10px 25px rgba(0,0,0,0.4); transition:0.3s;}
.botonYoutube img:hover{ transform:scale(1.08);}

.botonApple{ position:fixed; top:396px; right:132px; z-index:9999;}
.botonApple img{ width:305px; border-radius:20px; box-shadow:0 10px 25px rgba(0,0,0,0.4); transition:0.3s;}
.botonApple img:hover{ transform:scale(1.08);}

/* BOTON DESCARGA */
.botonDescarga{ position:fixed; top:540px; right:132px; z-index:9999;}
.botonDescarga img{ width:305px; cursor:pointer; transition:0.3s;}
.botonDescarga img:hover{ transform:scale(1.08);}

/* LOGO */
.logoFijo{ position:fixed; top:4px; left:-10px; z-index:99999;}
.logoFijo img{ width:110px; }

/* SPOTIFY EMBED */
.spotifyEmbed{ display:flex; justify-content:center; }

@media (min-width:769px){
  .spotifyEmbed{ transform: translate(-217px, 33px); }
}

/* CELULAR */
@media (max-width:768px){
  body{ min-height:180vh; overflow-x:hidden; }
  .fotoCentral{ width:85vw; margin-top:81px; left:0; top:0;}

  .botonSpotify,.botonYoutube,.botonApple,.botonDescarga{
    position:static;
    display:block;
    margin:auto;
    width:300px;
  }

  .botonSpotify img,.botonYoutube img,.botonApple img,.botonDescarga img{
    width:300px;
  }

  .logoFijo{ top:10px; left:0; }
  .logoFijo img{ width:65px; }

  .spotifyEmbed{ transform: translate(0px, 350px); }
}

/* ===== MINI VENTANA SPOTIFY ===== */
.spotifyModal{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.75);
  z-index:999999;
  justify-content:center;
  align-items:center;
}

.spotifyBox{
  width:90%;
  max-width:520px;
  height:650px;
  background:#111;
  border-radius:15px;
  overflow:hidden;
  position:relative;
  box-shadow:0 10px 40px rgba(0,0,0,0.8);
}

.closeBtn{
  position:absolute;
  top:10px;
  right:15px;
  color:white;
  font-size:22px;
  cursor:pointer;
  z-index:10;
}
</style>
</head>

<body>

<img class="fotoCentral"
src="https://github.com/user-attachments/assets/ad66a631-bd77-42d9-af9e-fbd95b66f24e">

<!-- SPOTIFY BUTTON (MODIFICADO) -->
<a class="botonSpotify" href="javascript:void(0)" onclick="abrirSpotify()">
<img src="https://github.com/user-attachments/assets/9cf817a2-2271-45cd-b2f4-93a8ec1aa662">
</a>

<a class="botonYoutube" href="https://youtu.be/LhNoNp9qEiQ" target="_blank">
<img src="https://github.com/user-attachments/assets/0425b689-3d8f-4387-b4fb-d4c4a2ce8930">
</a>

<a class="botonApple" href="https://music.apple.com/mx/song/solo/1706135810" target="_blank">
<img src="https://github.com/user-attachments/assets/67ba3a7a-83b2-4675-9393-7de6fa176470">
</a>

<div class="botonDescarga">
  <img id="imgDescarga"
  src="https://github.com/user-attachments/assets/4dcc798c-a448-43d3-b034-6196688c053f"
  onclick="seguirSpotify()">
</div>

<div class="spotifyEmbed">
  <iframe style="border-radius:12px" 
  src="https://open.spotify.com/embed/playlist/5H4YBJmZKajvJnANiswCvX" 
  width="60%" height="80" frameborder="0"
  allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
  </iframe>
</div>

<div class="logoFijo">
  <img src="https://github.com/user-attachments/assets/f1a56ada-5a62-432b-9f2b-3da43e0b8544">
</div>

<!-- MINI VENTANA SPOTIFY -->
<div id="spotifyModal" class="spotifyModal">
  <div class="spotifyBox">
    <div class="closeBtn" onclick="cerrarSpotify()">✕</div>

    <iframe 
      id="spotifyFrame"
      width="100%"
      height="100%"
      style="border:0"
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
    </iframe>
  </div>
</div>

<script>

function abrirSpotify(){
  document.getElementById("spotifyFrame").src =
    "https://open.spotify.com/artist/1YTUjUT54hysCojyJUrCRs";

  document.getElementById("spotifyModal").style.display = "flex";
}

function cerrarSpotify(){
  document.getElementById("spotifyModal").style.display = "none";
  document.getElementById("spotifyFrame").src = "";
}

/* TU CÓDIGO ORIGINAL */
const client_id = "f10cb7ef8c5b4ad8bbf15eaf2a239e8d";
const redirect_uri = "https://sisiman.vercel.app";
const artist_id = "5KeX79pQzo2M92PKqjOhxo";
const playlist_id = "5H4YBJmZKajvJnANiswCvX";

const linkDescarga = "https://mega.nz/folder/7vxDmDCC#6rkxkdLm9xoP234xWUjp1g";
const imgDesbloqueado = "https://github.com/user-attachments/assets/9848879b-01bd-47fd-8895-898216feb2e0";

let tokenSpotify = localStorage.getItem("spotify_token");

function seguirSpotify(){
  const scope = "user-follow-read playlist-read-private";

  const auth_url =
  "https://accounts.spotify.com/authorize"+
  "?client_id="+client_id+
  "&response_type=code"+
  "&redirect_uri="+encodeURIComponent(redirect_uri)+
  "&scope="+encodeURIComponent(scope)+
  "&show_dialog=true";

  window.location = auth_url;
}

window.onload = () => {
  const urlParams = new URLSearchParams(window.location.search);
  const code = urlParams.get("code");

  if(code){
    intercambiarCodePorToken(code);
  }
}

async function intercambiarCodePorToken(code){

  const body = new URLSearchParams({
    grant_type: "authorization_code",
    code: code,
    redirect_uri: redirect_uri,
    client_id: client_id
  });

  const respuesta = await fetch("https://accounts.spotify.com/api/token", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: body
  });

  const data = await respuesta.json();

  tokenSpotify = data.access_token;

  localStorage.setItem("spotify_token", tokenSpotify);

  window.history.replaceState({}, document.title, "/");

  desbloquearDescarga();
}

function desbloquearDescarga(){
  const img = document.getElementById("imgDescarga");
  img.src = imgDesbloqueado;
  img.onclick = () => window.open(linkDescarga, "_blank");

  alert("DESCARGA DESBLOQUEADA 🚀");
}

</script>

</body>
</html>
