<style>
  /* El selector 'body' aplica el cambio a TODA la pantalla */
  body {
    background-color: #000000 !important; /* Negro absoluto */
    color: #ffffff; /* Letras blancas para que se puedan leer */
    margin: 0;
    padding: 0;
  }

  /* Opcional: Esto hace que los enlaces se vean mejor sobre negro */
  a {
    color: #1DB954; /* Color verde (como el de Spotify) para resaltar */
  }
</style>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Imagen Movible</title>

<style>
  body{
    background:white;
    height:110vh;
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
  }

  .imagen{
    width:120px;   /* 🔎 CAMBIA EL TAMAÑO AQUÍ */
    position:fixed;

    left:-15px;      /* 👉 DERECHA (+) IZQUIERDA (-) */
    top:4px;       /* 👇 ABAJO (+) ARRIBA (-) */

    transition:0.3s;
  }
</style>
</head>

<body>

<img class="imagen"
src="https://github.com/user-attachments/assets/f1a56ada-5a62-432b-9f2b-3da43e0b8544">

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Imagen movible REAL</title>

<style>
  body{
    margin:0;
    background:white;
  }

  .logo{
    display:block;
    width:400px; /* tamaño PC */

    transform: translate(120px,100px);
    /* translate(X , Y)  →  (horizontal , vertical) */
  }

  /* 📱 CELULAR */
  @media (max-width:768px){
    .logo{
      width:400px; /* tamaño celular */

      transform: translate(20px,40px);
    }
  }

</style>
</head>

<body>

<img class="logo"
src="https://github.com/user-attachments/assets/ad66a631-bd77-42d9-af9e-fbd95b66f24e">

</body>
</html>
