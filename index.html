<style>
  /* El selector 'body' aplica el cambio a TODA la pantalla */
  body {
    background-color: #000000 !important; /* Negro absoluto */
    color: #ffffff; /* Letras blancas para que se puedan leer */
    margin: 0;
    padding: 0;
  }

  /* Opcional: Esto hace que los enlaces se vean mejor sobre negro */
  a {
    color: #1DB954; /* Color verde (como el de Spotify) para resaltar */
  }
</style>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Imagen Movible</title>

<style>
    body{
        background:white;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        margin:0;
    }

    /* CAJA QUE CONTIENE LA IMAGEN */
    .contenedor {
        width:400%;
        text-align:center;
    }

    /* IMAGEN */
    .imagen-movible{
        width:500px;      /* 👈 CAMBIA EL TAMAÑO AQUÍ */
        position:relative;
        left:-250px;         /* 👈 MOVER IZQUIERDA/DERECHA AQUÍ */
        transition:0.3s;
        cursor:pointer;
    }
</style>
</head>

<body>

<div class="contenedor">
    <img class="imagen-movible"
    src="https://github.com/user-attachments/assets/3c320006-1971-4a02-89d2-06eecc2dff8b">
</div>

</body>
</html>
