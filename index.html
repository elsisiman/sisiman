<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi página</title>

<style>
body{
  margin:0;
  padding:0;
  background:black;
  font-family:Arial, Helvetica, sans-serif;
  min-height:200vh;
}

/* FOTO CENTRAL */
.fotoCentral{
  display:block;
  width:900px;
  margin:auto;
  margin-top:-150px;
  position:relative;
  left:-218px;
  top:20px;
}

/* BOTONES EXISTENTES */
.botonSpotify{ position:fixed; top:18px; right:56px; z-index:9999;}
.botonSpotify img{ width:450px; border-radius:20px; box-shadow:0 10px 25px rgba(0,0,0,0.4); transition:0.3s;}
.botonSpotify img:hover{ transform:scale(1.08);}

.botonYoutube{ position:fixed; top:217px; right:151px; z-index:9999;}
.botonYoutube img{ width:280px; border-radius:20px; box-shadow:0 10px 25px rgba(0,0,0,0.4); transition:0.3s;}
.botonYoutube img:hover{ transform:scale(1.08);}

.botonApple{ position:fixed; top:376px; right:132px; z-index:9999;}
.botonApple img{ width:305px; border-radius:20px; box-shadow:0 10px 25px rgba(0,0,0,0.4); transition:0.3s;}
.botonApple img:hover{ transform:scale(1.08);}

/* BOTON DESCARGA */
.botonDescarga{ position:fixed; top:520px; right:127px; z-index:9999;}
.botonDescarga img{ width:305px; cursor:pointer; transition:0.3s;}
.botonDescarga img:hover{ transform:scale(1.08);}

/* LOGO */
.logoFijo{ position:fixed; top:4px; left:-10px; z-index:99999;}
.logoFijo img{ width:110px; }

/* NUEVO BOTON TIENDA (PUERTA) - CON ANIMACIÓN DE ESCALA */
.botonTienda{ position:fixed; top:120px; left:-6px; z-index:99999; text-align: left;}
.botonTienda a{
  display: inline-block;
  text-decoration: none;
  background-color: transparent; 
  color: #ffffff;
  padding: 10px 20px; 
  font-family: Arial, sans-serif;
  font-size: 16px;
  font-weight: bold;
  border: none; 
  border-radius: 0;
  text-transform: uppercase;
  transition: 0.3s; 
  letter-spacing: 1px; 
}
.botonTienda a:hover{ 
  transform: scale(1.08); 
}

/* --- BOTÓN WHATSAPP --- */
.botonWhatsApp { position: fixed; top: 160px; left: 10px; z-index: 99999; text-align: left;}
.botonWhatsApp a { 
  display: inline-block; 
  text-decoration: none; 
  background-color: #25D366; 
  color: #ffffff; 
  padding: 2px 4px; 
  font-family: Arial, sans-serif; 
  font-size: 10px; 
  font-weight: bold; 
  border-radius: 10px; 
  text-transform: uppercase; 
  transition: 0.3s; 
  letter-spacing: 1px; 
}
.botonWhatsApp a:hover { transform: scale(1.08); }

/* --- BOTÓN EPK --- */
.botonEPK { position: fixed; top: 185px; left: -6px; z-index: 99999; text-align: left;}
.botonEPK a { 
  display: inline-block; 
  text-decoration: none; 
  background-color: transparent; 
  color: #ffffff; 
  padding: 10px 20px; 
  font-family: Arial, sans-serif; 
  font-size: 16px; 
  font-weight: bold; 
  border: none; 
  border-radius: 0; 
  text-transform: uppercase; 
  transition: 0.3s; 
  letter-spacing: 1px; 
}
.botonEPK a:hover { transform: scale(1.08); }

/* SPOTIFY EMBED */
.spotifyEmbed{ display:flex; justify-content:center; }


/* =======================================================
   ESTILOS BASE DE LOS DOS TEXTOS NORMALES
   ======================================================= */
.seccionTexto, .seccionTexto2 {
  color: #e0e0e0;       
  font-size: 16px;       
  line-height: 1.6;      
  z-index: 1;
  font-family: 'Arial', sans-serif; 
}


/* AJUSTES PARA PC */
@media (min-width:769px){
  .spotifyEmbed{ transform: translate(-216px, 28px); }

  /* CONTROL DE SCROLL EXCLUSIVO PARA PC */
  body { 
    min-height: 250vh; 
  }

  /* TEXTO 1: Mueve libremente "cantondecarton" */
  .seccionTexto {
    width: 445px;
    text-align: left;      
    margin-top: 31px;      
    margin-left: 90px;    
  }

  /* TEXTO 2: Mueve libremente "3125951818" */
  .seccionTexto2 {
    width: 400px;
    text-align: left;      
    margin-top: -3px;      
    margin-left: 89px;    
  }
}

/* CELULAR */
@media (max-width:768px){
  body{ min-height:221vh; overflow-x:hidden; }
  
  .fotoCentral{ width:85vw; margin-top:81px; left:0; top:0;}

  .botonSpotify {
    position: absolute;
    top: 570px;          
    right: 14px;         
    width: 330px;        
    display: block;
    margin: 0;
  }

  .botonYoutube {
    position: absolute;   
    top: 743px;          
    right: 68px;         
    width: 232px;        
    display: block;
    margin: 0;
  }

  .botonApple {
    position: absolute;
    top: 903px;          
    right: 47px;         
    width: 260px;        
    display: block;
    margin: 0;
  }

  .botonDescarga {
    position: absolute;
    top: 1043px;         
    right: 23px;         
    width: 310px;        
    display: block;
    margin: 0;
  }

  .botonSpotify img, .botonYoutube img, .botonApple img, .botonDescarga img {
    width: 100%;
  }

  .logoFijo{ top:10px; left:0; }
  .logoFijo img{ width:65px; }

  .botonTienda{ position: absolute; top: 44px; left: 50px; }
  .botonTienda a{ padding: 8px 15px; font-size: 15px; }
  .botonTienda a:hover{ transform: scale(1.08); }

  /* AJUSTE CELULAR WHATSAPP */
  .botonWhatsApp { position: absolute; top: 48px; left: 137px; }
  .botonWhatsApp a { padding: 3px 10px; font-size: 10px; }
  
  /* AJUSTE CELULAR EPK */
  .botonEPK { position: absolute; top: 75px; left: 50px; }
  .botonEPK a { padding: 8px 15px; font-size: 15px; }

  .spotifyEmbed { 
    position: absolute;
    transform: none; 
    display: block;
    top: 1254px;       
    left: 2vw;       
    width: 90vw;      
  }
  
  .spotifyEmbed iframe {
    width: 105% !important;
    height: 80px;     
  }

  .seccionTexto {
    position: absolute;
    top: 1338px;         
    left: -8vw;        
    width: 85vw;
    text-align: center;
  }

  .seccionTexto2 {
    position: absolute;
    top: 1359px;         
    left: -26vw;        
    width: 83vw;
    text-align: center;
  }
}
</style>
