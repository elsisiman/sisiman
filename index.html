<style>
  /* El selector 'body' aplica el cambio a TODA la pantalla */
  body {
    background-color: #000000 !important; /* Negro absoluto */
    color: #ffffff; /* Letras blancas para que se puedan leer */
    margin: 0;
    padding: 0;
  }

  /* Opcional: Esto hace que los enlaces se vean mejor sobre negro */
  a {
    color: #1DB954; /* Color verde (como el de Spotify) para resaltar */
  }
</style>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mi página</title>

<style>
body{
  margin:0;
  background:white; /* tu fondo sigue intacto */
  font-family:Arial, Helvetica, sans-serif;
}

/* BOTON SPOTIFY */
#spotifyBtn{
  position:fixed;
  top:20px;     /* distancia desde arriba */
  left:20px;    /* distancia desde la izquierda */
  z-index:999999;
}

#spotifyBtn img{
  width:300px;  /* cambia tamaño aquí */
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.25);
  transition:0.3s;
}

#spotifyBtn img:hover{
  transform:scale(1.08);
}
</style>
</head>

<body>

<!-- TU CONTENIDO NORMAL -->
<h1 style="text-align:center;margin-top:120px;">
Tu página está funcionando 👍
</h1>

<!-- BOTON SPOTIFY FLOTANTE -->

href="https://open.spotify.com/track/1xm343jLVRrE6F3seWr5OP?context=spotify:playlist:5H4YBJmZKajvJnANiswCvX&si=PnNy9WOSQ8eAfIXm5clv4Q"
target="_blank">
<img src="https://github.com/user-attachments/assets/9cf817a2-2271-45cd-b2f4-93a8ec1aa662">

</body>
</html>
