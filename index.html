<!DOCTYPE html> 
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi página</title>

<style>
body{
  margin:0;
  padding:0;
  background:black;
  font-family:Arial, Helvetica, sans-serif;
  min-height:200vh;
}

/* FOTO CENTRAL */
.fotoCentral{
  display:block;
  width:900px;
  margin:auto;
  margin-top:-150px;
  position:relative;
  left:-218px;
  top:20px;
}

/* BOTONES EXISTENTES */
.botonSpotify{ position:fixed; top:18px; right:56px; z-index:9999;}
.botonSpotify img{ width:450px; border-radius:20px; box-shadow:0 10px 25px rgba(0,0,0,0.4); transition:0.3s;}
.botonSpotify img:hover{ transform:scale(1.08);}

.botonYoutube{ position:fixed; top:217px; right:151px; z-index:9999;}
.botonYoutube img{ width:280px; border-radius:20px; box-shadow:0 10px 25px rgba(0,0,0,0.4); transition:0.3s;}
.botonYoutube img:hover{ transform:scale(1.08);}

.botonApple{ position:fixed; top:376px; right:132px; z-index:9999;}
.botonApple img{ width:305px; border-radius:20px; box-shadow:0 10px 25px rgba(0,0,0,0.4); transition:0.3s;}
.botonApple img:hover{ transform:scale(1.08);}

/* BOTON DESCARGA */
.botonDescarga{ position:fixed; top:520px; right:127px; z-index:9999;}
.botonDescarga img{ width:305px; cursor:pointer; transition:0.3s;}
.botonDescarga img:hover{ transform:scale(1.08);}

/* LOGO */
.logoFijo{ position:fixed; top:4px; left:-10px; z-index:99999;}
.logoFijo img{ width:110px; }

/* SPOTIFY EMBED */
.spotifyEmbed{ display:flex; justify-content:center; }

@media (min-width:769px){
  .spotifyEmbed{ transform: translate(-216px, 28px); }
}

/* CELULAR */
@media (max-width:768px){
  body{ min-height:180vh; overflow-x:hidden; }
  .fotoCentral{ width:85vw; margin-top:81px; left:0; top:0;}

  .botonSpotify,.botonYoutube,.botonApple,.botonDescarga{
    position:static;
    display:block;
    margin:auto;
    width:300px;
  }

  .botonSpotify img,.botonYoutube img,.botonApple img,.botonDescarga img{
    width:300px;
  }

  .logoFijo{ top:10px; left:0; }
  .logoFijo img{ width:65px; }

  .spotifyEmbed{ transform: translate(0px, 350px); }
}
</style>
</head>

<body>

<img class="fotoCentral" src="https://github.com/user-attachments/assets/ad66a631-bd77-42d9-af9e-fbd95b66f24e">

<a class="botonSpotify" href="https://open.spotify.com/intl-es/track/1xm343jLVRrE6F3seWr5OP?context=spotify:playlist:5H4YBJmZKajvJnANiswCvX&si=PnNy9WOSQ8eAfIXm5clv4Q" target="_blank">
  <img src="https://github.com/user-attachments/assets/9cf817a2-2271-45cd-b2f4-93a8ec1aa662">
</a>

<a class="botonYoutube" href="https://youtu.be/LhNoNp9qEiQ" target="_blank">
  <img src="https://github.com/user-attachments/assets/0425b689-3d8f-4387-b4fb-d4c4a2ce8930">
</a>

<a class="botonApple" href="https://music.apple.com/mx/song/solo/1706135810" target="_blank">
  <img src="https://github.com/user-attachments/assets/67ba3a7a-83b2-4675-9393-7de6fa176470">
</a>

<div class="botonDescarga">
  <img id="imgDescarga" src="https://github.com/user-attachments/assets/4dcc798c-a448-43d3-b034-6196688c053f" onclick="seguirSpotify()">
</div>

<div class="spotifyEmbed">
  <iframe style="border-radius:12px" src="https://open.spotify.com/embed/playlist/5H4YBJmZKajvJnANiswCvX" width="60%" height="80" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
</div>

<div class="logoFijo">
  <img src="https://github.com/user-attachments/assets/f1a56ada-5a62-432b-9f2b-3da43e0b8544">
</div>

<script>
const client_id = "f10cb7ef8c5b4ad8bbf15eaf2a239e8d";
const redirect_uri = "https://sisiman.vercel.app";
const artist_id = "5KeX79pQzo2M92PKqjOhxo";
const playlist_id = "5H4YBJmZKajvJnANiswCvX";

const linkDescarga = "https://mega.nz/folder/7vxDmDCC#6rkxkdLm9xoP234xWUjp1g";
const imgDesbloqueado = "https://github.com/user-attachments/assets/9848879b-01bd-47fd-8895-898216feb2e0";

let tokenSpotify = localStorage.getItem("spotify_token");

function seguirSpotify(){
  const scope = "user-follow-read playlist-read-private";

  const auth_url =
  "https://accounts.spotify.com/authorize"+
  "?client_id="+client_id+
  "&response_type=code"+
  "&redirect_uri="+encodeURIComponent(redirect_uri)+
  "&scope="+encodeURIComponent(scope)+
  "&show_dialog=true";

  // Configuración del tamaño y posición de la mini ventana flotante (Popup)
  const ancho = 500;
  const alto = 650;
  const izquierda = (screen.width / 2) - (ancho / 2);
  const arriba = (screen.height / 2) - (alto / 2);

  // Abre la ventana de Spotify de forma externa pero controlada
  window.open(auth_url, "SpotifyAuth", `width=${ancho},height=${alto},top=${arriba},left=${izquierda}`);
}

// Escuchar cuando el proceso termine (ya sea en carga inicial o mediante redirección del popup)
window.onload = () => {
  const urlParams = new URLSearchParams(window.location.search);
  const code = urlParams.get("code");

  if(code){
    // Si estamos dentro del popup, mandamos el código a la ventana padre y cerramos
    if (window.opener) {
      window.opener.postMessage({ tipo: "SPOTIFY_CODE", code: code }, "*");
      window.close();
    } else {
      intercambiarCodePorToken(code);
    }
  }
}

// Escuchar mensajes provenientes del popup flotante
window.addEventListener("message", (evento) => {
  if (evento.data && evento.data.tipo === "SPOTIFY_CODE") {
    intercambiarCodePorToken(evento.data.code);
  }
});

async function intercambiarCodePorToken(code){
  const body = new URLSearchParams({
    grant_type: "authorization_code",
    code: code,
    redirect_uri: redirect_uri,
    client_id: client_id
  });

  try {
    const respuesta = await fetch("https://accounts.spotify.com/api/token", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: body
    });

    const data = await respuesta.json();
    tokenSpotify = data.access_token;
    localStorage.setItem("spotify_token", tokenSpotify);
    
    // Limpiar la URL de códigos limpios
    window.history.replaceState({}, document.title, "/");
    desbloquearDescarga();
  } catch (error) {
    console.error("Error al obtener el token:", error);
  }
}

function desbloquearDescarga(){
  const img = document.getElementById("imgDescarga");
  img.src = imgDesbloqueado;
  img.onclick = () => window.open(linkDescarga, "_blank");
  alert("DESCARGA DESBLOQUEADA 🚀");
}
</script>

</body>
</html>
