<style>
  /* El selector 'body' aplica el cambio a TODA la pantalla */
  body {
    background-color: #000000 !important; /* Negro absoluto */
    color: #ffffff; /* Letras blancas para que se puedan leer */
    margin: 0;
    padding: 0;
  }

  /* Opcional: Esto hace que los enlaces se vean mejor sobre negro */
  a {
    color: #1DB954; /* Color verde (como el de Spotify) para resaltar */
  }
</style>

<style>
  .foto-ajustable {
    /* Esto permite moverla por toda la pantalla */
    position: fixed; 

    /* 1. POSICIÓN (Cambia los números para moverla) */
    top: 0px;   /* Distancia desde arriba (Aumenta para bajarla) */
    left: 0px;   /* Distancia desde la izquierda (Aumenta para mover a la derecha) */

    /* 2. TAMAÑO (Cambia este número para el tamaño) */
    width: 300px; /* Ancho de la foto (Ponle 400px si la quieres más grande) */
    
    height: auto; /* Esto mantiene la forma para que no se estire feo */
    z-index: 999; /* Asegura que la foto esté al frente de todo */
  }
</style>

     alt="imagen"
