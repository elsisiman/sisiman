<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi página</title>

<style>
body{
  margin:0;
  padding:0;
  background:black;
  font-family:Arial, Helvetica, sans-serif;
  min-height:200vh;
}

/* FOTO CENTRAL */
.fotoCentral{
  display:block;
  width:900px;
  margin:auto;
  margin-top:-150px;
  position:relative;
  left:-218px;
  top:20px;
}

/* BOTON YOUTUBE PC */
.botonSpotify{
  position:fixed;
  top:100px;
  right:56px;
  z-index:9999;
}

.botonSpotify img{
  width:450px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.4);
  transition:0.3s;
}

.botonSpotify img:hover{
  transform:scale(1.08);
}

/* LOGO PC */
.logoFijo{
  position:fixed;
  top:4px;
  left:-10px;
  z-index:99999;
}

.logoFijo img{
  width:110px;
}

/* 🎧 EMBED BASE */
.spotifyEmbed{
  display:flex;
  justify-content:center;
}

/* 🎚️ PC CONTROL */
@media (min-width: 769px){
  .spotifyEmbed{
    transform: translate(-217px, 33px);
    transition: 0.3s;
  }
}

/* 📱 CELULAR */
@media (max-width: 768px){

  body{
    min-height: 180vh;
    overflow-x: hidden;
  }

  .fotoCentral{
    width:85vw;
    margin-top:81px;
    left:0px;
    top:0px;
  }

  .botonSpotify{
    position:static;
    display:block;
    margin:auto;
    margin-top:0px;
    width:300px;
  }

  .botonSpotify img{
    width:300px;
    border-radius:18px;
  }

  .logoFijo{
    position:fixed;
    top:10px;
    left:0px;
  }

  .logoFijo img{
    width:65px;
  }

  .spotifyEmbed{
    transform: translate(0px, 350px);
    display:flex;
    justify-content:center;
  }
}
</style>
</head>

<body>

<img class="fotoCentral"
src="https://github.com/user-attachments/assets/ad66a631-bd77-42d9-af9e-fbd95b66f24e">

<!-- 🔥 BOTON YOUTUBE HIBRIDO -->
<a class="botonSpotify" href="#" onclick="abrirYouTube(); return false;">
<img src="https://github.com/user-attachments/assets/9cf817a2-2271-45cd-b2f4-93a8ec1aa662">
</a>

<!-- 🎧 EMBED SPOTIFY -->
<div class="spotifyEmbed">
  <iframe style="border-radius:12px" 
  src="https://open.spotify.com/embed/playlist/5H4YBJmZKajvJnANiswCvX" 
  width="60%" 
  height="80" 
  frameborder="0" 
  allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
  </iframe>
</div>

<div class="logoFijo">
  <img src="https://github.com/user-attachments/assets/f1a56ada-5a62-432b-9f2b-3da43e0b8544">
</div>

<!-- 🚀 SCRIPT DEEP LINK YOUTUBE -->
<script>
function abrirYouTube() {

  var appLink = "youtube://watch?v=LhNoNp9qEiQ";
  var webLink = "https://youtu.be/LhNoNp9qEiQ";

  window.location.href = appLink;

  setTimeout(function(){
      window.location.href = webLink;
  }, 900);
}
</script>

</body>
</html>
