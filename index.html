<!DOCTYPE html> 
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi página</title>

<style>
body{
  margin:0;
  padding:0;
  background:black;
  font-family:Arial, Helvetica, sans-serif;
  min-height:200vh;
}

/* FOTO CENTRAL */
.fotoCentral{
  display:block;
  width:900px;
  margin:auto;
  margin-top:-150px;
  position:relative;
  left:-218px;
  top:20px;
}

/* BOTON SPOTIFY */
.botonSpotify{
  position:fixed;
  top:40px;
  right:56px;
  z-index:9999;
}

.botonSpotify img{
  width:450px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.4);
  transition:0.3s;
}

.botonSpotify img:hover{
  transform:scale(1.08);
}

/* BOTON YOUTUBE */
.botonYoutube{
  position:fixed;
  top:240px;
  right:151px;
  z-index:9999;
}

.botonYoutube img{
  width:280px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.4);
  transition:0.3s;
}

.botonYoutube img:hover{
  transform:scale(1.08);
}

/* 🍎 BOTON APPLE MUSIC */
.botonApple{
  position:fixed;
  top:357px;
  right:160px;
  z-index:9999;
}

.botonApple img{
  width:322px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.4);
  transition:0.3s;
}

.botonApple img:hover{
  transform:scale(1.08);
}

/* LOGO */
.logoFijo{
  position:fixed;
  top:4px;
  left:-10px;
  z-index:99999;
}

.logoFijo img{
  width:110px;
}

/* EMBED */
.spotifyEmbed{
  display:flex;
  justify-content:center;
}

@media (min-width: 769px){
  .spotifyEmbed{
    transform: translate(-217px, 33px);
  }
}

/* CELULAR */
@media (max-width: 768px){

  body{
    min-height:180vh;
    overflow-x:hidden;
  }

  .fotoCentral{
    width:85vw;
    margin-top:81px;
    left:0;
    top:0;
  }

  .botonSpotify,
  .botonYoutube,
  .botonApple{
    position:static;
    display:block;
    margin:auto;
    width:300px;
  }

  .botonSpotify img,
  .botonYoutube img,
  .botonApple img{
    width:300px;
    border-radius:18px;
  }

  .logoFijo{
    top:10px;
    left:0;
  }

  .logoFijo img{
    width:65px;
  }

  .spotifyEmbed{
    transform: translate(0px, 350px);
  }
}
</style>
</head>

<body>

<img class="fotoCentral"
src="https://github.com/user-attachments/assets/ad66a631-bd77-42d9-af9e-fbd95b66f24e">

<!-- SPOTIFY -->
<a class="botonSpotify"
href="https://open.spotify.com/intl-es/track/1xm343jLVRrE6F3seWr5OP?context=spotify:playlist:5H4YBJmZKajvJnANiswCvX&si=PnNy9WOSQ8eAfIXm5clv4Q"
target="_blank" rel="noopener">
<img src="https://github.com/user-attachments/assets/9cf817a2-2271-45cd-b2f4-93a8ec1aa662">
</a>

<!-- YOUTUBE -->
<a class="botonYoutube"
href="https://youtu.be/LhNoNp9qEiQ"
target="_blank"
rel="noopener"
onclick="abrirYT(event)">
<img src="https://github.com/user-attachments/assets/0425b689-3d8f-4387-b4fb-d4c4a2ce8930">
</a>

<!-- 🍎 APPLE MUSIC (abre en nueva pestaña) -->
<a class="botonApple"
href="https://music.apple.com/mx/song/solo/1706135810"
target="_blank"
rel="noopener">
<img src="https://github.com/user-attachments/assets/5077c28c-49e7-4f69-b0d2-f0145ff95cc8">
</a>

<!-- EMBED SPOTIFY -->
<div class="spotifyEmbed">
  <iframe style="border-radius:12px" 
  src="https://open.spotify.com/embed/playlist/5H4YBJmZKajvJnANiswCvX" 
  width="60%" height="80" frameborder="0"
  allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
  </iframe>
</div>

<div class="logoFijo">
  <img src="https://github.com/user-attachments/assets/f1a56ada-5a62-432b-9f2b-3da43e0b8544">
</div>

<script>
function abrirYT(e){
  var esMovil = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if(esMovil){
    e.preventDefault();
    window.location.href = "youtube://watch?v=LhNoNp9qEiQ";
  }
}
</script>

</body>
</html>
