<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda</title>
    
    <style>
        /* Este es el truco para el color negro */
        body {
            background-color: black; /* Esto lo hace negro sólido */
            margin: 0;               /* Quita bordes blancos molestos */
            height: 100vh;           /* Cubre todo el alto de la pantalla */
            text-align: center;      /* Centra todo el contenido de la tienda */
        }

        /* LOGO (Extraído exactamente de tu página principal) */
        .logoFijo{ position:fixed; top:4px; left:-10px; z-index:99999;}
        .logoFijo img{ width:110px; }

        /* AJUSTE DEL LOGO PARA CELULAR */
        @media (max-width:768px){
            .logoFijo{ top:10px; left:0; }
            .logoFijo img{ width:65px; }
        }

        /* =======================================================
           👕 CAJA CONTENEDORA DE LA PLAYERA (MUEVE TODO JUNTO)
           ======================================================= */
        .caja-completa-playera {
            display: block;
            width: 435px;         /* Ajusta el ancho de toda la sección */
            text-align: center;   
            margin: 10px auto 20px auto; /* Centrado base automático */

            /* 🔥 TUS CONTROLES DE MOVIMIENTO LIBRE: */
            position: relative;   
            top: 0px;             /* Cambia este número para subir (-) o bajar (+) la playera con todo su texto */
            left: 0px;            /* Cambia este número para mover a la izquierda (-) o derecha (+) */
        }

        /* ESTILO PARA LA IMAGEN ADENTRO DE LA CAJA */
        .fotoCamisa {
            display: block;
            width: 100%;          /* Toma el ancho total de su caja contenedora */
            border-radius: 10px;  
        }

        /* =======================================================
           🧢 CAJA INDEPENDIENTE PARA LA FOTO DE LA GORRA
           ======================================================= */
        .caja-foto-gorra {
            display: block;
            text-align: center;
            margin: 40px auto;    /* Separación base con el producto de arriba */

            /* 📐 CAMBIA EL ANCHO DE LA FOTO DESDE AQUÍ: */
            width: 415px;         /* Pon un número más grande o más chico para cambiar el tamaño */

            /* 🔥 CONTROLES PARA MOVER LA GORRA LIBREMENTE: */
            position: relative;   
            top: -674px;             
            left: -447px;            
        }

        /* Asegura que la foto herede el ancho de su propia caja */
        .caja-foto-gorra img {
            display: block;
            width: 100%;
            border-radius: 10px;
            
            /* 📐 SI QUISIERAS OBLIGAR A LA FOTO A TENER UN ALTO FIJO:
               Puedes cambiar 'auto' por una medida en px (ejemplo: height: 400px;), 
               aunque dejarlo en 'auto' evita que la foto se mire estirada o aplastada. */
            height: auto; 
        }

        /* ESTILOS DEL TEXTO Y EL BOTÓN PRINCIPAL */
        .nombreProducto {
            color: white;
            font-family: Arial, sans-serif;
            font-size: 22px;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 15px;
            letter-spacing: 1px;
        }

        .precioProducto {
            color: #00ff66; 
            font-family: Arial, sans-serif;
            font-size: 18px;
            font-weight: bold;
            margin-top: 5px;
            margin-bottom: 10px;
        }

        /* TEXTO QUE MUESTRA LAS PIEZAS QUE QUEDAN */
        .textoStock {
            color: #aaa;
            font-family: Arial, sans-serif;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .botonComprar {
            display: inline-block;
            text-decoration: none;
            background-color: transparent;
            color: white;
            border: 2px solid white; 
            padding: 10px 30px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
        }

        .botonComprar:hover:not(:disabled) {
            transform: scale(1.08);
            background-color: white;
            color: black; 
        }

        /* ESTILO PARA CUANDO SE AGOTE (BOTÓN DESACTIVADO) */
        .botonComprar:disabled {
            border-color: #444;
            color: #444;
            cursor: not-allowed;
            transform: none;
        }

        /* =======================================================
           ESTILOS DE LA VENTANA DE PAGOS (MODAL)
           ======================================================= */
        .ventanaPagos {
            display: none; 
            position: fixed;
            z-index: 999999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85); 
        }

        .contenidoVentana {
            background-color: #0a0a0a;
            margin: 15% auto;
            padding: 30px;
            border: 1px solid #333;
            width: 80%;
            max-width: 400px;
            border-radius: 15px;
            text-align: center;
            position: relative;
        }

        .cerrarVentana {
            color: #aaa;
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .cerrarVentana:hover {
            color: white;
        }

        .tituloPagos {
            color: white;
            font-family: Arial, sans-serif;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .opcionPago {
            display: block;
            text-decoration: none;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            border: 1px solid #444;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .opcionPago.mp:hover { background-color: #009ee3; border-color: #009ee3; } 
        .opcionPago.pp:hover { background-color: #003087; border-color: #003087; } 
        .opcionPago.crypto:hover { background-color: #f3ba2f; color: black; border-color: #f3ba2f; } 

        /* SI ENTRAN DESDE CELULAR */
        @media (max-width:768px){
            .caja-completa-playera, .caja-foto-gorra {
                width: 80vw;      
                margin-top: 100px; 
            }
            .contenidoVentana {
                margin: 40% auto; 
            }
        }
    </style>

</head>
<body>
    
    <div class="logoFijo">
        <img src="https://github.com/user-attachments/assets/f1a56ada-5a62-432b-9f2b-3da43e0b8544">
    </div>

    <div class="caja-completa-playera">
        <img class="fotoCamisa" src="https://github.com/user-attachments/assets/24ecfaa2-120b-4282-9fb5-d70f2827e065" alt="IMG-20250526-WA0020">

        <div class="nombreProducto">Playera Sisiman</div>
        <div class="precioProducto">$250</div>
        
        <div id="contadorStock" class="textoStock"></div>

        <button id="btnComprar" class="botonComprar" onclick="abrirPagos()">Comprar Ahora</button>
    </div>

    <div class="caja-foto-gorra">
        <img alt="Gemini_Generated_Image_98vtde98vtde98vt" src="https://github.com/user-attachments/assets/df154711-4a6d-404e-bda6-a93981692340" />
    </div>


    <div id="miVentana" class="ventanaPagos">
        <div class="contenidoVentana">
            <span class="cerrarVentana" onclick="cerrarPagos()">&times;</span>
            <div class="tituloPagos">Selecciona tu método de pago</div>
            
            <a class="opcionPago mp" href="https://mpago.la/2vykypR" target="_blank">Mercado Pago / Tarjeta / OXXO</a>
            
            <a class="opcionPago pp" href="https://www.paypal.com/ncp/payment/5MXXHA8MQZ3QE" target="_blank">PayPal</a>
            
            <a class="opcionPago crypto" href="https://wa.me/523125951818?text=Hola!%20Quiero%20comprar%20la%20Playera%20Sisiman%20y%20pagar%20con%20Criptomonedas,%20p%C3%A1same%20la%20wallet" target="_blank">Criptomonedas</a>
        </div>
    </div>


    <script>
        var piezasDisponibles = 10; 

        var boton = document.getElementById("btnComprar");
        var textoContador = document.getElementById("contadorStock");

        if (piezasDisponibles > 0) {
            textoContador.innerHTML = "Quedan sólo " + piezasDisponibles + " piezas disponibles";
        } else {
            textoContador.innerHTML = "Edición Limitada Agotada";
            boton.innerHTML = "AGOTADO";
            boton.disabled = true; 
        }

        function abrirPagos() {
            document.getElementById("miVentana").style.display = "block";
        }

        function cerrarPagos() {
            document.getElementById("miVentana").style.display = "none";
        }

        window.onclick = function(event) {
            var ventana = document.getElementById("miVentana");
            if (event.target == ventana) {
                ventana.style.display = "none";
            }
        }
    </script>

</body>
</html>
