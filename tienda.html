<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda</title>
    
    <style>
        /* Base de la página */
        body {
            background-color: black; 
            margin: 0;               
            height: 100vh;           
            text-align: center;      
        }

        /* LOGO FIJO */
        .logoFijo{ position:fixed; top:4px; left:-10px; z-index:99999;}
        .logoFijo img{ width:110px; }

        @media (max-width:768px){
            .logoFijo{ top:10px; left:0; }
            .logoFijo img{ width:65px; }
        }

        /* =======================================================
           👕 SECCIÓN EXCLUSIVA DE LA PLAYERA
           ======================================================= */
        .caja-completa-playera {
            display: block;
            width: 435px;
            text-align: center;
            
            /* LO QUE SE MUEVE: Cambia estos números para mover la PLAYERA con todo y sus letras */
            margin-top: 20px;     /* Espacio arriba */
            margin-bottom: 40px;  /* Espacio abajo */
            margin-left: auto;    /* Centrado automático izquierda */
            margin-right: auto;   /* Centrado automático derecha */
        }
        .foto-de-la-playera {
            display: block;
            width: 100%;        
            border-radius: 10px;  
            margin-bottom: 15px;
        }

        /* =======================================================
           🧢 SECCIÓN EXCLUSIVA DE LA GORRA
           ======================================================= */
        .caja-completa-gorra {
            display: block;
            width: 435px;
            text-align: center;
            
            /* LO QUE SE MUEVE: Cambia estos números para mover la GORRA con todo y sus letras */
            margin-top: -200px;     /* Espacio arriba */
            margin-bottom: 40px;  /* Espacio abajo */
            margin-left: 50;    /* Centrado automático izquierda */
            margin-right: auto;   /* Centrado automático derecha */
        }
        .foto-de-la-gorra {
            display: block;
            width: 100%;        
            border-radius: 10px;  
            margin-bottom: 15px;
        }

        /* =======================================================
           ESTILOS GENERALES DE TEXTOS Y BOTONES
           ======================================================= */
        .nombreProducto {
            color: white;
            font-family: Arial, sans-serif;
            font-size: 22px;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 15px;
            letter-spacing: 1px;
        }

        .precioProducto {
            color: #00ff66; 
            font-family: Arial, sans-serif;
            font-size: 18px;
            font-weight: bold;
            margin-top: 5px;
            margin-bottom: 10px;
        }

        .textoStock {
            color: #aaa;
            font-family: Arial, sans-serif;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .botonComprar {
            display: inline-block;
            text-decoration: none;
            background-color: transparent;
            color: white;
            border: 2px solid white; 
            padding: 10px 30px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
        }

        .botonComprar:hover:not(:disabled) {
            transform: scale(1.08);
            background-color: white;
            color: black; 
        }

        .botonComprar:disabled {
            border-color: #444;
            color: #444;
            cursor: not-allowed;
            transform: none;
        }

        /* VENTANA DE PAGOS (MODAL) */
        .ventanaPagos {
            display: none; 
            position: fixed;
            z-index: 999999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85); 
        }

        .contenidoVentana {
            background-color: #0a0a0a;
            margin: 15% auto;
            padding: 30px;
            border: 1px solid #333;
            width: 80%;
            max-width: 400px;
            border-radius: 15px;
            text-align: center;
            position: relative;
        }

        .cerrarVentana {
            color: #aaa;
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .cerrarVentana:hover { color: white; }

        .tituloPagos {
            color: white;
            font-family: Arial, sans-serif;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .opcionPago {
            display: block;
            text-decoration: none;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            border: 1px solid #444;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .opcionPago.mp:hover { background-color: #009ee3; border-color: #009ee3; } 
        .opcionPago.pp:hover { background-color: #003087; border-color: #003087; } 
        .opcionPago.crypto:hover { background-color: #f3ba2f; color: black; border-color: #f3ba2f; } 

        /* AJUSTES PARA CELULAR */
        @media (max-width:768px){
            .caja-completa-playera, .caja-completa-gorra {
                width: 80vw;      
                margin-top: 100px; 
            }
            .contenidoVentana {
                margin: 40% auto; 
            }
        }
    </style>

</head>
<body>
    
    <div class="logoFijo">
        <img src="https://github.com/user-attachments/assets/f1a56ada-5a62-432b-9f2b-3da43e0b8544">
    </div>

    <div class="caja-completa-playera">
        <img class="foto-de-la-playera" src="https://github.com/user-attachments/assets/24ecfaa2-120b-4282-9fb5-d70f2827e065" alt="Playera Sisiman">
        <div class="nombreProducto">Playera Sisiman</div>
        <div class="precioProducto">$250</div>
        <div id="contadorStock" class="textoStock"></div>
        <button id="btnComprar" class="botonComprar" onclick="abrirPagos()">Comprar Ahora</button>
    </div>

    <hr style="border: 0; border-top: 1px solid #222; margin: 40px auto; width: 80px;">

    <div class="caja-completa-gorra">
        <img class="foto-de-la-gorra" src="https://github.com/user-attachments/assets/df154711-4a6d-404e-bda6-a93981692340" alt="Gorra Sisiman">
        <div class="nombreProducto">Gorra Sisiman</div>
        <div class="precioProducto">$250</div>
        <div class="textoStock">Edición Limitada</div>
        <button class="botonComprar" onclick="abrirPagos()">Comprar Ahora</button>
    </div>


    <div id="miVentana" class="ventanaPagos">
        <div class="contenidoVentana">
            <span class="cerrarVentana" onclick="cerrarPagos()">&times;</span>
            <div class="tituloPagos">Selecciona tu método de pago</div>
            
            <a class="opcionPago mp" href="https://mpago.la/2vykypR" target="_blank">Mercado Pago / Tarjeta / OXXO</a>
            
            <a class="opcionPago pp" href="https://www.paypal.com/ncp/payment/5MXXHA8MQZ3QE" target="_blank">PayPal</a>
            
            <a class="opcionPago crypto" href="https://wa.me/523125951818?text=Hola!%20Quiero%20comprar%20la%20Playera%20Sisiman%20y%20pagar%20con%20Criptomonedas,%20p%C3%A1same%20la%20wallet" target="_blank">Criptomonedas</a>
        </div>
    </div>


    <script>
        var piezasDisponibles = 10; 

        var boton = document.getElementById("btnComprar");
        var textoContador = document.getElementById("contadorStock");

        if (piezasDisponibles > 0) {
            textoContador.innerHTML = "Quedan sólo " + piezasDisponibles + " piezas disponibles";
        } else {
            textoContador.innerHTML = "Edición Limitada Agotada";
            boton.innerHTML = "AGOTADO";
            boton.disabled = true; 
        }

        function abrirPagos() {
            document.getElementById("miVentana").style.display = "block";
        }

        function cerrarPagos() {
            document.getElementById("miVentana").style.display = "none";
        }

        window.onclick = function(event) {
            var ventana = document.getElementById("miVentana");
            if (event.target == ventana) {
                ventana.style.display = "none";
            }
        }
    </script>

</body>
</html>
