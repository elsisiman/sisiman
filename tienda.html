    <script>
        function enviarA_API(nombreEvento) {
            const pixelId = '1574777457157001';
            const accessToken = 'EAAWm16Lyo2wBRjqYGbWHJIbQ5fl2TtB1QLVYXLEqSV02xAnfYHE8OEZBjC2ldulTYoZBFwBubnL04AexJWq3YgQ3jL6VGWZBMbDPRFeZB71ArUDYhYmd5aczZAc6O9iAZAxQwUo1ZC2DbSRl4Io2OCElq03hCMRZAZAwWqvLAjAB7mZB67BA9xAimu7RSeWYinSmdgIwZDZD';
            
            // 1. Browser Event (Pixel)
            if (typeof fbq === 'function') { fbq('track', nombreEvento); }

            // 2. Server Event (CAPI)
            fetch(`https://graph.facebook.com/v17.0/${pixelId}/events?access_token=${accessToken}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    data: [{
                        event_name: nombreEvento,
                        event_time: Math.floor(Date.now() / 1000),
                        action_source: 'website',
                        user_data: { client_user_agent: navigator.userAgent }
                    }]
                })
            }).catch(err => console.log('CAPI falló, pero el pixel está activo'));
        }
