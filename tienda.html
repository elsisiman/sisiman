<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda</title>

    <style>
        body { background-color: black; margin: 0; padding-bottom: 50px; text-align: center; }
        .logoFijo{ position:fixed; top:4px; left:10px; z-index:99999;}
        .logoFijo img{ width:110px; }

        /* VISTA PC: Mantiene el diseño original pero sin encimarse */
        .caja-completa-playera { width: 435px; margin: 20px auto 40px auto; }
        .fotoCamisa { display: block; width: 100%; border-radius: 10px; }
        
        .caja-foto-gorra { width: 435px; margin: 0 auto 40px auto; }
        .caja-foto-gorra img { display: block; width: 100%; border-radius: 10px; height: 479px; object-fit: fill; }

        .nombreProducto { color: white; font-family: Arial, sans-serif; font-size: 22px; font-weight: bold; text-transform: uppercase; margin-top: 15px; letter-spacing: 1px; }
        .precioProducto { color: #00ff66; font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; margin-top: 5px; margin-bottom: 10px; }
        .textoStock { color: #aaa; font-family: Arial, sans-serif; font-size: 14px; margin-bottom: 20px; }
        .botonComprar { display: inline-block; background-color: transparent; color: white; border: 2px solid white; padding: 10px 30px; font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; text-transform: uppercase; cursor: pointer; transition: 0.3s; }
        .botonComprar:hover:not(:disabled) { transform: scale(1.08); background-color: white; color: black; }
        
        /* Modal de pagos - Ahora garantizado al frente */
        .ventanaPagos { display: none; position: fixed; z-index: 999999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.85); }
        .contenidoVentana { background-color: #0a0a0a; margin: 10% auto; padding: 30px; border: 1px solid #333; width: 80%; max-width: 400px; border-radius: 15px; position: relative; }
        .cerrarVentana { color: #aaa; position: absolute; top: 10px; right: 20px; font-size: 28px; cursor: pointer; }
        .opcionPago { display: block; text-decoration: none; color: white; font-family: Arial, sans-serif; border: 1px solid #444; padding: 12px; margin-bottom: 12px; border-radius: 8px; }

        @media (max-width:768px){ 
            .caja-completa-playera, .caja-foto-gorra { width: 80vw; }
        }
    </style>
</head>
<body>
    
    <div class="logoFijo"><img src="https://github.com/user-attachments/assets/f1a56ada-5a62-432b-9f2b-3da43e0b8544"></div>

    <div class="caja-completa-playera">
        <img class="fotoCamisa" src="https://github.com/user-attachments/assets/24ecfaa2-120b-4282-9fb5-d70f2827e065">
        <div class="nombreProducto">Playera Sisiman</div>
        <div class="precioProducto">$250</div>
        <div id="contadorStock" class="textoStock"></div>
        <button class="botonComprar" onclick="abrirPagos('ventanaPlayera')">Comprar Ahora</button>
    </div>

    <div class="caja-foto-gorra">
        <img src="https://github.com/user-attachments/assets/85ef5a17-fe41-4897-a6ac-f5d9aa4ae679">
        <div class="nombreProducto">GORRA SISIMAN</div>
        <div class="precioProducto">$250</div>
        <div id="contadorGorra" class="textoStock"></div>
        <button class="botonComprar" onclick="abrirPagos('ventanaGorra')">Comprar Ahora</button>
    </div>

    <div id="ventanaPlayera" class="ventanaPagos">
        <div class="contenidoVentana">
            <span class="cerrarVentana" onclick="cerrarPagos('ventanaPlayera')">&times;</span>
            <div class="opcionPago" onclick="window.open('https://mpago.la/2vykypR')">Mercado Pago</div>
        </div>
    </div>

    <script>
        function abrirPagos(id) { document.getElementById(id).style.display = "block"; }
        function cerrarPagos(id) { document.getElementById(id).style.display = "none"; }
    </script>
</body>
</html>
