<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio/EPK sisiman</title>
    <style>
        /* Bloqueo total de movimiento lateral */
        html, body { 
            margin: 0; 
            padding: 0; 
            overflow-x: hidden; 
            width: 100%;
        }
        body { background-color: #000000; font-family: Arial, Helvetica, sans-serif; color: #ffffff; min-height: 200vh; }
        
        /* ... (tus otros estilos se mantienen igual) ... */

        @media (max-width: 768px) {
            body { height: 2200px; }
            
            /* REPOSICIÓN DEL BOTÓN A TU GUSTO ORIGINAL */
            .botonMasInfo { position: absolute; top: 1890px; left: 6%; z-index: 1000; animation: latido 1.2s infinite ease-in-out; }
            
            .contenidoInfo { height: 70vh; overflow-y: auto;}
            
            /* Asegurar que nada se salga del ancho */
            .contenedorVideo, .cajaTexto, .contenedorBotones { width: 100%; box-sizing: border-box; }
        }
    </style>
</head>
