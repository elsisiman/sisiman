<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Biografía</title>
    <style>
        /* Fondo Negro Sólido */
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            font-family: Arial, Helvetica, sans-serif;
            color: #ffffff;
            min-height: 100vh;
        }

        /* Logo extraído de tu index */
        .logoFijo {
            position: fixed;
            top: 4px;
            left: -10px;
            z-index: 99999;
        }
        .logoFijo img {
            width: 110px;
        }

        /* Ajuste para celular igual que en tu index */
        @media (max-width: 768px) {
            .logoFijo {
                top: 10px;
                left: 0;
            }
            .logoFijo img {
                width: 65px;
            }
        }
    </style>
</head>
<body>

    <!-- Logo exacto como en el index -->
